================================================================================
[프로젝트 개요 - 새 대화창에서 이 파일을 처음 보는 경우를 위한 전체 설명]

이 파일의 역할:
  LS증권 예스트레이더/예스스팟에서 발견된 일목균형표 신호(나스닥100,
  S&P500, 금선물의 여러 타임프레임 - 분봉1~120/틱봉30~1000)를
  실시간으로 받아, 중복 제거 + 정렬 + 한국시간 변환까지 해서 보여주는
  웹 대시보드.

전체 시스템 구조:
  [예스스팟 전략 스크립트들 - signal_<종목>_min.js 등, 예스트레이더 안에서 실행]
    -> Main.PrintOnFile로 신호 발견시마다 텍스트 줄로 기록
    -> [yesspot_signals.txt]
       -> [bridge_signals.py] 가 감시하다가 WebSocket(ws://localhost:9100)으로 전달
          -> [이 파일: yesspot_signals_dashboard.html] 에서 실시간 표시
             (dashboard_server.py가 이 html을 http://localhost:8080 으로 서빙)

신호 판정 로직 요약 (일목균형표 기반):
  SB(선행스팬B)가 2~4봉 연속 평탄한 동안, SA(선행스팬A)가 SB를
  아래->위로 뚫으면 Bull(상향삼각형), 위->아래로 뚫으면 Bear(하향삼각형).
  평탄 길이에 따라 1/2/3 단계로 세분화됨 (BULL1/2/3, BEAR1/2/3).

이 화면의 기능:
  - WebSocket으로 실시간 신호 수신, 완전 중복(종목+타임프레임+신호+
    날짜+시각+가격 전부 동일)은 자동 제거
  - 표 머리글 클릭으로 정렬 기준 변경 (기본: 시각 최신순)
  - 종목/신호종류로 필터링
  - 서버시간(시카고, CME거래소 현지시각)과 한국시간(KST)을 함께 표시
    (서머타임까지 정확히 반영해서 변환, chicagoToKST 함수 참고)
  - 타임프레임을 "5M"(5분봉), "300T"(300틱봉) 형태로 간략 표시
  - "대시보드 종료" 버튼: WebSocket으로 브릿지에 종료 신호를 보내면,
    브릿지(bridge_signals.py)가 stop.flag를 만들고, dashboard_server.py가
    이를 감지해 웹서버까지 함께 종료됨.

[알아낸 함정들 - 다시 겪지 않도록 기록]
  - 시각 데이터는 예스트레이더가 제공하는 그대로 "시카고 현지시각"임.
    한국시간이 아니므로 반드시 변환해서 봐야 함.
  - "종목"/"타임프레임" 표시가 "100", "100 5K" 처럼 깨져 보인다면, 이는
    예스스팟 스크립트의 옛날 버전(줄바꿈 누락 버그)이 기록한 오염된
    데이터가 yesspot_signals.txt에 남아있는 것. 그 파일을 열어서
    내용을 비우면 이후로는 깨끗하게 기록됨.
  - 예스스팟의 Grid(표) 객체는 클릭 이벤트가 없어서, "표에서 신호를
    클릭하면 차트가 자동으로 열리는" 기능은 이 플랫폼에서는 구현이
    안 되는 것으로 결론남. 이 대시보드에서 시각/타임프레임을 보고
    예스트레이더에서 수동으로 차트를 열어 확인해야 함.

[함께 필요한 파일들 - 전부 같은 폴더에 있어야 함]
  bridge_signals.py    - 이 파일이 접속하는 ws://localhost:9100 서버
  dashboard_server.py  - 이 html 파일 자체를 서빙하는 8080 웹서버
  start_yesspot_dashboard.bat - 위 두 파이썬 서버를 한번에 실행+이 페이지 자동 오픈

[사용 순서]
  1. start_yesspot_dashboard.bat 실행 (또는 bridge_signals.py와
     dashboard_server.py를 따로 각각 실행)
  2. 이 페이지가 자동으로 열리거나, http://localhost:8080/yesspot_signals_dashboard.html 접속
  3. 예스트레이더에서 예스스팟 전략(6개 중 원하는 것) 실행
  4. 이 화면에 실시간으로 신호가 쌓이는 것을 확인

    표시(BAR_DATA_UNSTABLE_ALERT와 동일 패턴), 같은 타임프레임이 연속으로
    저품질 처리될 때의 알림 스팸을 막기 위해 라벨당 60초 쿨다운 적용. 겸사로
    파일 상단 [버전] 요약줄이 v1.30/2026-09-07로 오래 방치돼 실제 변경이력
    (v1.47까지 진행)과 어긋나 있던 것도 이번에 같이 맞춤.
================================================================================
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>일목균형표 신호 목록</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0a0e10;
    --panel:#11171a;
    --line:#232b2f;
    --text:#c9d6d3;
    --muted:#5f7370;
    --cyan:#35c9c9;
    --amber:#f2a93b;
    --blue:#5b8cff;
    --red:#e5534b;
    --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--mono); font-size:13px; padding:10px 14px;}
  h1{font-size:16px; font-weight:600; margin:0; color:#e8f2ef;}
  .titlebar{display:flex; align-items:center; gap:20px; margin-bottom:8px; flex-wrap:wrap;}
  .sub{color:var(--muted); font-size:11.5px; margin-bottom:16px;}
  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:8px; flex-wrap:wrap;}
  .pill{padding:4px 10px; border-radius:10px; border:1px solid var(--line); font-size:11.5px; color:var(--muted);}
  .pill.on{border-color:var(--cyan); color:var(--cyan);}
  select, input[type=text]{
    background:#0d1315; border:1px solid var(--line); color:var(--text);
    padding:5px 8px; border-radius:4px; font-family:var(--mono); font-size:12px;
  }
  button{
    background:#1a2226; border:1px solid var(--line); color:var(--text);
    padding:4px 10px; border-radius:4px; font-family:var(--mono); font-size:12px; cursor:pointer;
  }
  button:hover{border-color:var(--cyan); color:#fff;}
  #btnShutdown{border-color:#5a2a28; color:#e5a5a0;}
  #btnShutdown:hover{border-color:var(--red); color:#fff; background:#3a1614;}
  #btnShutdown:disabled{opacity:0.5; cursor:default;}
  #btnNotify.on{border-color:var(--green,#3ecf8e); color:#3ecf8e; background:rgba(62,207,142,0.1);}

  /* ---------- MT5 스타일 인앱 알림 팝업 ---------- */
  /* 윈도우 OS 알림 설정이 사용자마다 다를 수 있어서, 페이지 안에서
     직접 뜨는 팝업으로 항상 확실히 알려줍니다(소리도 같이 남). */
  #alertPopup{
    position:fixed; top:20px; right:20px; width:340px; max-height:70vh;
    background:#1a1006; border:2px solid var(--amber); border-radius:10px;
    padding:16px 18px; box-shadow:0 8px 32px rgba(0,0,0,0.5);
    z-index:9999; display:none; flex-direction:column;
    animation:alertSlideIn 0.25s ease-out;
  }
  #alertPopup.show{display:flex;}
  @keyframes alertSlideIn{
    from{ transform:translateX(400px); opacity:0; }
    to{ transform:translateX(0); opacity:1; }
  }
  #alertPopup .ap-title{
    font-size:15px; font-weight:700; color:var(--amber); margin-bottom:6px;
    display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0;
  }
  #alertPopup .ap-close{cursor:pointer; color:var(--muted); font-size:18px; line-height:1;}
  #alertPopup .ap-close:hover{color:#fff;}

  #alertPopup .ap-body{
    font-size:13px; color:var(--text); line-height:1.5;
    overflow-y:auto; flex:1;
  }
  #alertPopup .ap-item{
    padding:8px 0; border-top:1px solid rgba(255,255,255,0.08); position:relative;
  }
  #alertPopup .ap-item:first-child{border-top:none; padding-top:0;}
  #alertPopup .ap-time{
    display:block; font-size:11px; color:var(--muted); margin-top:2px;
  }
  .stat{display:inline-flex; gap:6px; align-items:baseline; margin-right:12px;}
  .stat .v{font-size:16px; font-weight:600; color:#e8f2ef;}
  .stat .k{font-size:10px; color:var(--muted); text-transform:uppercase;}

  .clockbar{display:flex; gap:16px; flex-wrap:wrap; align-items:baseline;}
  .clock{padding:0;}
  .clock .v{font-size:13px; font-weight:600; color:var(--cyan);}
  .clock .k{font-size:9px; color:var(--muted); text-transform:uppercase;}

  /* [2026-07-19 신규] 종목별 월물 선택 + D-day 표시 헤더 */
  .contractbar{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:8px; align-items:center;}
  .contract-card{padding:0; min-width:0; display:flex; align-items:center; gap:6px;}
  .contract-card .cc-title{font-size:11px; font-weight:700; color:#e8f2ef; display:flex; align-items:center; gap:6px; white-space:nowrap;}
  .contract-card .cc-dday{font-size:11px; font-weight:600; padding:1px 8px; border-radius:10px; border:1px solid var(--line); color:var(--muted);}
  .contract-card .cc-dday.dday-soon{color:var(--red); border-color:var(--red);}
  .contract-card .cc-dday.dday-warn{color:var(--amber); border-color:var(--amber);}
  .contract-card select{
    width:auto; min-width:0; background:#0d1315; border:1px solid var(--line); color:var(--text);
    padding:2px 6px; border-radius:4px; font-family:var(--mono); font-size:11px;
  }
  .contract-card .cc-empty{font-size:11px; color:var(--muted);}

  table{width:100%; border-collapse:separate; border-spacing:0; background:var(--panel); border:1px solid var(--line); border-radius:6px;}
  thead th{
    background:#161d21; color:var(--muted); text-align:left; padding:6px 8px; font-size:11px;
    text-transform:uppercase; letter-spacing:0.5px; cursor:pointer; user-select:none; border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:5;
  }
  thead th:hover{color:#fff;}
  thead th.sorted{color:var(--cyan);}
  thead th.sorted2{color:#7fa3a0;}
  thead th.sorted3{color:#5d8280;}
  thead th.sorted4{color:#476260;}
  tbody td{padding:4px 8px; border-bottom:1px solid var(--line); font-size:12px;}
  tbody tr:hover{background:#161d21;}
  .kind-bull{color:var(--amber); font-weight:600;}
  .kind-bear{color:var(--blue); font-weight:600;}
  .new-mark{color:var(--cyan); font-weight:700;}
  .confirm-star{position:relative; display:inline-flex; font-weight:700; font-size:15px; cursor:help; line-height:1;}
  .confirm-star .star-base{color:var(--muted);}
  .confirm-star .star-fill{position:absolute; left:0; top:0; overflow:hidden; color:#ffd25a; white-space:nowrap;}
  .confirm-star.confirm-star-mixed .star-fill{color:#ffffff;} /* 분봉+틱봉이 섞여서 일치한 경우 흰색으로 구분 */
  .left-flat-star{position:relative; display:inline-flex; font-weight:700; font-size:15px; cursor:help; line-height:1; margin-left:2px;}
  .left-flat-star .left-flat-star-base{color:var(--muted);}
  .left-flat-star .left-flat-star-fill{position:absolute; left:0; top:0; overflow:hidden; color:#a855f7; white-space:nowrap;}
  /* [2026-08-27 추가][그룹 접기/펼치기 버튼 - 별표와 크기 맞춤] 별표(15px)와
     나란히 있어도 어색하지 않도록, 딱 그 높이에 맞춘 사각형을 CSS로 그리고
     그 안에 +/− 텍스트만 넣는다(폰트 글리프 크기 들쭉날쭉 문제 회피). */
  .group-toggle-box{display:inline-flex; align-items:center; justify-content:center; width:11px; height:11px; border:1px solid #f2a93b; border-radius:2px; color:#f2a93b; font-size:8.5px; font-weight:800; line-height:1; cursor:pointer; vertical-align:middle; margin-right:4px; margin-top:-2px; box-sizing:border-box;}
  /* [2026-08-27 추가][묶음 펼침 표시] 엑셀 아웃라인 그룹처럼, 펼쳐진 묶음의
     시작~끝 행 왼쪽에 세로 강조선을 이어 그리고, 묶음의 마지막 행 밑에
     가로 경계선을 그어서 "여기까지가 한 묶음이었다"를 눈으로 알 수 있게 함. */
  tr.group-row-first td:first-child, tr.group-row-mid td:first-child, tr.group-row-last td:first-child{border-left:3px solid #f2a93b;}
  tr.group-row-first td{border-top:2px solid #f2a93b;}
  tr.group-row-last td{border-bottom:2px solid #f2a93b;}
  .group-toggle-box:hover{background:rgba(242,169,59,0.18);}
  .checkbox-filter{
    display:inline-flex; align-items:center; gap:10px;
    background:#0d1315; border:1px solid var(--line); border-radius:6px;
    padding:6px 12px; font-size:12px;
  }
  .checkbox-filter label{display:inline-flex; align-items:center; gap:4px; cursor:pointer; white-space:nowrap;}
  .dirChk-bull-label{color:var(--amber); font-weight:600;}
  .dirChk-bear-label{color:var(--blue); font-weight:600;}
  .checkbox-filter input[type="checkbox"]{cursor:pointer;}
  /* [신규][2026-09-29][고정된 묶음 표시, 사용자 요청] 같은 그룹(종목+가격+
     방향)에 이미 고정(📌)된 신호가 있는데 아직 안 고정된 나머지 신호의
     체크박스 - "고정" 체크박스가 체크됐을 때 쓰는 그 파란색을 그대로
     쓰되 갈고리(체크표시)만 뺀다.
     [수정][2026-09-29][재수정 - 사용자 요청] v5.11에서 appearance:none으로
     직접 그린 파란 박스는 "고정칸 체크됐을 때 파란색"과 살짝 다른 색/
     모양이 될 수 있다는 지적 - 별도 색을 만들지 않고, 체크된 상태와
     완전히 동일한 네이티브 렌더링(accent-color 포함)을 쓰는 브라우저
     표준 기능인 checkbox.indeterminate를 사용한다. 이러면 진짜 "고정
     체크박스가 체크됐을 때"와 100% 같은 파란색/굵기로 칠해지고, 안에는
     체크(✓) 대신 가로선(─)만 남아 갈고리가 빠진 것과 사실상 동일해
     보인다(네이티브 체크박스가 "칠해지되 체크 아님"을 표현하는 유일한
     표준 방법 - indeterminate 설정은 render() 안 JS에서 함, 아래 CSS는
     별도 배경색을 안 만들고 커서만 지정). */
  .pinChk-groupPinned{ cursor:pointer; }
  .achieve-yes{font-size:14px; cursor:help;}
  .achieve-no{font-size:14px; cursor:help; opacity:0.7;}
  .achieve-wait{font-size:13px; cursor:help; opacity:0.55;}
  .achieve-wait-restored{opacity:1; filter:drop-shadow(0 0 2px #ffb300);} /* [2026-08-19 추가] 복원된 신호는 불투명+주황빛 강조로 구분 */
  .achieve-missing{font-size:14px; cursor:help;}
  .achieve-retracted{font-size:14px; cursor:help;}
  .achieve-explained{font-size:14px; cursor:help; opacity:0.7;}
  .today-row{background:rgba(210,213,218,0.16);}
  .today-row:hover{background:rgba(210,213,218,0.24);}
  .yesterday-row{background:rgba(210,213,218,0.08);}
  .yesterday-row:hover{background:rgba(210,213,218,0.16);}
  .tablewrap{height:70vh; overflow-y:auto; border-radius:6px;} /* [2026-09-10] 70vh는 JS(fitTableWrapHeight)가 로드되기 전 깜빡임 방지용 기본값 - 실제 높이는 JS가 남은 화면공간에 맞춰 동적으로 재계산함 */
  .empty{padding:30px; text-align:center; color:var(--muted);}

  .connbanner{
    display:none; background:#e5534b; color:#fff; font-weight:700;
    padding:10px 14px; border-radius:6px; margin-bottom:14px; font-size:13px;
  }
</style>
</head>
<body>

<div id="alertPopup">
  <div class="ap-title">
    <span id="apTitle">🔔 새 신호</span>
    <span class="ap-close" id="apClose">✕</span>
  </div>
  <div class="ap-body" id="apBody"></div>
</div>

<div class="titlebar">
  <h1>일목균형표 신호</h1>
  <span style="color:var(--muted); font-size:11px; padding:2px 6px;" title="지금 브라우저가 실제로 돌리고 있는 코드 버전 - 파일을 열어보지 않아도 여기서 바로 확인 가능">v5.14</span>
  <div class="clockbar">
    <div class="clock"><div class="v" id="clockCT">-</div><div class="k">현재 서버시간(시카고)</div></div>
    <div class="clock"><div class="v" id="clockKST">-</div><div class="k">현재 한국시간(KST)</div></div>
  </div>
</div>

<div class="contractbar" id="contractBar"></div>

<div class="connbanner" id="connBanner">⚠ 브릿지(bridge_signals.py)와 연결이 끊어졌습니다.</div>

<div class="toolbar">
  <span class="pill off" id="wsStatus">연결 시도중...</span>
  <div class="stat"><span class="v" id="statTotal">0</span><span class="v" style="color:var(--muted)">(</span><span class="v" id="statBull" style="color:var(--amber)">0</span><span class="v" style="color:var(--muted)">/</span><span class="v" id="statBear" style="color:var(--blue)">0</span><span class="v" style="color:var(--muted)">)</span></div>

  <div id="filterItemsBox" class="checkbox-filter"></div>
  <div id="filterDirBox" class="checkbox-filter">
    <label class="dirChk-bull-label"><input type="checkbox" class="dirChk" value="BULL" checked> Bull</label>
    <label class="dirChk-bear-label"><input type="checkbox" class="dirChk" value="BEAR" checked> Bear</label>
  </div>
  <div id="filterKindBox" class="checkbox-filter">
    <label><input type="checkbox" class="kindChk" value="1" checked> 1</label>
    <label><input type="checkbox" class="kindChk" value="2" checked> 2</label>
    <label><input type="checkbox" class="kindChk" value="3" checked> 3</label>
  </div>
  <div id="filterAchieveBox" class="checkbox-filter">
    <label><input type="checkbox" class="achieveChk" value="achieved" checked> ✅</label>
    <label><input type="checkbox" class="achieveChk" value="invalid" checked> ❌</label>
    <label><input type="checkbox" class="achieveChk" value="waiting" checked> ⏳</label>
    <label><input type="checkbox" class="achieveChk" value="missing" checked> ⚠️</label>
    <label><input type="checkbox" class="achieveChk" value="retracted" checked> 🚫</label>
    <label><input type="checkbox" class="achieveChk" value="explained_removal" checked> 🗑️</label>
    <label><input type="checkbox" class="achieveChk" value="unknown" checked> ❔</label>
  </div>
  <select id="filterDays">
    <option value="0">전체 기간</option>
    <option value="1">1일 (오늘)</option>
    <option value="2">2일</option>
    <option value="3">3일</option>
    <option value="4">4일</option>
    <option value="5">5일</option>
    <option value="6">6일</option>
  </select>
  <button id="btnPurge" title="감시중 목록 포함. 7일 이상 경과한 달성/무효 Data를 로그파일에서 영구 삭제. ">완전삭제</button>
  <button id="btnPurgeKeepPending" title="감시중 목록 제외. 7일 이상 경과한 달성/무효 Data를 로그파일에서 영구 삭제. ">신호달성 완전삭제</button>
  <button id="btnNotify">🔔 알림 켜기</button>
  <button id="btnExportExcel">📗 저장</button>
  <button id="btnReport" onclick="window.open('yesspot_report.html','_blank')">📊 통계</button>
  <!-- [제거][2026-09-13] 📈차트정확도/🔍요청진단 버튼 삭제 - 브릿지가
       BAR_MISMATCH/SUSPECT_LABEL_DUP 등을 더 이상 전달하지 않게 되면서
       (대책없는 표시라 사용자 요청으로 제거) 이 두 버튼은 항상 빈 화면만
       띄우게 됐음. showChartAccuracyReport/showRequestDiagReport 함수
       자체는 코드에 남아있지만(다른 곳에서 참조 안 함, 안전) 호출 경로가
       없어져 실질적으로 죽은 기능. -->
  <button id="btnShutdown">대시보드 종료</button>
</div>

<div class="tablewrap" id="tablewrap">
  <table>
    <thead>
      <tr>
        <th>📌</th>
        <th data-key="achieveStatus">상태</th>
        <th data-key="isConfirmed">확인</th>
        <th data-key="item">종목</th>
        <th data-key="contract">월물</th>
        <th data-key="tf">타임</th>
        <th data-key="kind">신호</th>
        <th data-key="datetime">서버시간</th>
        <th data-key="price" title="달성/무효 판정의 실제 기준가(SB) - 이 가격에 도달하면 달성, 반대로 벗어나면 무효로 판정된다">가격</th>
        <th data-key="kst" title="목표삼각형(SA가 SB를 뚫은 삼각형)의 뾰족여부(한 지점이 확실히 튀어나왔는지/두 봉짜리 뭉툭한 고원인지) + 선행평탄구간(SB가 몇 봉째 안 바뀌었는지) + 그 봉에서 SA가 SB를 넘어선 높이(pt)">가격시간</th>
        <th data-key="reason">사유</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="11" class="empty">아직 수신된 신호가 없습니다. 브릿지 연결을 기다리는 중...</td></tr>
    </tbody>
  </table>
</div>

<!-- [2026-07-30 추가][상태이력 모달] 화살표 버튼 클릭 시 전체 이력을
     시간순으로 줄바꿔서 보여주는 팝업 - 30초(하트비트끊김) 알림팝업(#alertPopup)과
     같은 디자인(색/테두리/타이틀바)으로 통일 -->
<div id="histModalOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
  <div id="histModalBox" style="background:#1a1006; border:2px solid var(--amber,#f2a93b); border-radius:10px; width:340px; max-height:70vh; display:flex; flex-direction:column; padding:16px 18px; box-shadow:0 8px 32px rgba(0,0,0,0.5);">
    <div id="histModalTitle" style="flex:0 0 auto; font-size:15px; font-weight:700; color:var(--amber,#f2a93b); margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; cursor:move; touch-action:none;">
      <span>전체 상태이력 <span style="font-size:11px; font-weight:400; color:var(--muted,#5f7370);">(서버시간 기준)</span></span>

    box.style.position = 'fixed';

    titleBar.setPointerCapture(ev.pointerId);

  });

function stripFrameShiftSuspect(s) {

  // 사용자 실측지적: 모달에 "...[WARM"으로 닫는 대괄호 없이 남음] 예전엔
  // "[FRAME_SHIFT_SUSPECT:...]" 안쪽 태그만 지우고, 그걸 감싸던 바깥쪽
  // "[SOURCE[...]]"의 여는 '['는 "줄 끝에 남은 트레일링 [만" 지우는
  // 별도 규칙(\[+$)에 맡겼었다 - 그런데 원본 데이터가 FRAME_SHIFT_SUSPECT
  // 태그 "안에서" 잘리면(닫는 ']'가 아예 없음), 지워지고 남는 바깥쪽 '['는
  // 줄 끝이 아니라 "WARM" 앞에 있어서(예: "[WARM") 그 규칙이 못 잡았다
  // (실측 재현: node로 확인, 기존 로직은 "[WARM"을 남기고 새 로직은
  // "[WARM]"로 정상 마감함). 안쪽/바깥쪽을 따로 지우는 대신, "[SOURCE[
  // FRAME_SHIFT_SUSPECT:...]]"(완전한 경우)와 "[SOURCE[FRAME_SHIFT_SUSPECT:
  // ...(잘린 경우)"를 SOURCE(WARM/REAL 등 대문자)까지 통째로 캡처해서
  // 한 번에 "[SOURCE]"로 재조립 - 두 경우 다 항상 깔끔하게 닫힌 "[SOURCE]"
  // 하나만 남는다(오탐 없음: FRAME_SHIFT_SUSPECT 태그가 아예 없는 일반

  s = s.replace(/\[([A-Z]+)\[FRAME_SHIFT_SUSPECT:[^\]]*\]\]/g, '[$1]'); // 완전한 경우

function koDisplay(text) {
  if (typeof text !== 'string' || !text) return text;
  var out = text;
  for (var i = 0; i < KO_DISPLAY_MAP.length; i++) {
    out = out.split(KO_DISPLAY_MAP[i][0]).join(KO_DISPLAY_MAP[i][1]);
  }
  return out;
}

  // 구조화된 그룹 데이터라 바로 쓸 수 있다.
  var groups = liveBarMismatchGroups;

  // 아래 300ms 디바운스 창이 매 배치마다 따로따로 만료돼, 배치 하나(300건)
  // 분량씩 화면이 계속 다시 그려지는 현상이 실제로 생겼다(사용자 스크린샷

// [2026-08-11 버그수정] 서버시간(CT) 원문을 그대로 보여주던 걸 한국시간
// (KST)으로 변환해서 보여주도록 수정 + 혼동 방지를 위해 "KST" 라벨을
// 항상 붙임(사용자 요청: CT/KST를 명확히 구분해서 표시할 것).
function fmtRawServerDT(raw){
  if (typeof raw !== 'string') return raw;
  var parts = raw.split(',');
  if (parts.length !== 2 || parts[0].length !== 8) return raw;
  // [근본수정][2026-09-13] 함수명은 "서버DT"인데 실제로는 chicagoToKST로
  // 변환해서 KST를 붙이고 있었음 - v1.39에서 모달을 서버시간 기준으로
  // 바꿀 때 이 함수는 안 고치고 다른 경로만 고쳐서 생긴 불일치(사용자
  // 지적). 변환 없이 원본 서버시간(CT) 그대로 포맷만 맞춰 반환한다.
  var y = parts[0].slice(0,4), mo = parts[0].slice(4,6), d = parts[0].slice(6,8);
  return mo + '/' + d + ' ' + parts[1] + ' CT';
}
// [2026-08-11 버그수정][근본수정] 서버(스크립트)가 stateHistory 각 단계에
// 남기는 시각(formatHistoryWhen)은 "MM/DD HH:MM:SS" 형태로 연도가 이미
// 빠져 있습니다(스크립트 쪽 설계). 그래서 하트비트/최종확정줄로 넘어오는
// HISTORY 원문(신호등록/눌림확인/대기중 등 각 단계별 시각)은 전부 CT
// (서버시간)를 그대로 담고 있고, 지금까지 모달에 그 CT 원문을 변환 없이
// 그대로 찍어왔습니다. 이제 그 안에 있는 모든 "(MM/DD HH:MM:SS)"를 찾아서
// KST로 바꿔치기합니다. 연도는 이 텍스트 자체에 없으므로, 그 신호가 속한
// 행(r)의 발생연도(r.date 앞 4자리)로 보완합니다 - 같은 감시목록 항목의
// 이력은 실질적으로 며칠~몇 주 안에서 끝나므로 연도가 걸치는 경우는
// 사실상 없습니다.
function convertHistoryCTtoKST(text, yearStr){
  if (typeof text !== 'string' || !text) return text;
  return text.replace(/\((\d{2})\/(\d{2}) (\d{2}:\d{2}:\d{2})\)/g, function(whole, mm, dd, hms){
    var kst = chicagoToKST(yearStr + mm + dd, hms);
    if (kst === '-') return whole;
    var kd = kst.slice(5,10).replace('-', '/');
    var kt = kst.slice(11);
    return '(' + kd + ' ' + kt + ' KST)';
  });
}
// [메인테이블 표시전용] r.kst 원본("YYYY-MM-DD HH:MM:SS")은 날짜필터/오래된

function fmtKSTForTable(kstIso){

// [신규][2026-09-07][가격시간 칸 표시] 꼭지점봉의 서버시각(옆 "서버시간"
// 칸과 동일한 "YYYYMMDD HH:MM:SS" 형식)에 꼭지점 높이(pt)를 괄호로 붙여

// [수정][2026-09-10]["가격시간" 칸 - 시각 제거, 괄호 제거, 순서를
// 뾰족/평탄/수치로 변경] 사용자 요청: 신호 등록 시점에 한 번만 찍히는
// 꼭지점봉 시각은 재계산이 안 되고(등록 이후 그대로 박제) 옛날 데이터와
// 섞이면 혼란만 준다는 판단 - 시각은 완전히 빼고 뾰족여부/평탄구간/높이만
// 쉼표로 나열한다. 값이 하나도 없으면(구버전 로그, 또는 등록시점
// undefined-버그가 있던 옛 데이터 포함) "-"만 표시.
function fmtApexCell(r){
  var parts = [];
  if (r.apexSharp === true) parts.push('뾰족');
  else if (r.apexSharp === false) parts.push('뭉툭');
  if (r.leftFlatRun !== null && r.leftFlatRun !== undefined && !isNaN(r.leftFlatRun)) parts.push('평탄' + r.leftFlatRun + '봉');
  if (r.apexHeight !== null && r.apexHeight !== undefined && !isNaN(r.apexHeight)) parts.push(r.apexHeight.toFixed(2) + 'pt');
  if (parts.length === 0) return '-';
  return parts.join(',');
}
function chicagoToKST(dateStr, timeStr){
  try{
    var y = parseInt(dateStr.slice(0,4),10), mo = parseInt(dateStr.slice(4,6),10), d = parseInt(dateStr.slice(6,8),10);
    var parts = timeStr.split(":");
    var h = parseInt(parts[0],10), mi = parseInt(parts[1],10), s = parseInt(parts[2]||"0",10);

    var guess = new Date(Date.UTC(y, mo-1, d, h, mi, s));
    var fmt = new Intl.DateTimeFormat('en-US', {
      timeZone:'America/Chicago', hour12:false,
      year:'numeric', month:'2-digit', day:'2-digit',
      hour:'2-digit', minute:'2-digit', second:'2-digit'
    });
    var p = {};
    fmt.formatToParts(guess).forEach(function(x){ p[x.type] = x.value; });
    var asChicago = new Date(Date.UTC(p.year, p.month-1, p.day, p.hour, p.minute, p.second));
    var diff = guess.getTime() - asChicago.getTime();
    var realUTC = new Date(guess.getTime() + diff);

    return realUTC.toLocaleString('sv-SE', {timeZone:'Asia/Seoul', hour12:false});
  }catch(e){
    return "-";
  }
}

function addSignal(sig){

      if (!pretty2CasesByPk[sig.item]) pretty2CasesByPk[sig.item] = {};
      pretty2CasesByPk[sig.item][p2Pk] = sig.prettyTriangle2Cases || '';
      if (sig.prettyTriangle2) {
        var p2Idx = allRows.findIndex(function(r){
          return r.item === sig.item && r.tf === sig.label && r.kind === sig.signalKind &&

    // 원본 라인을 재전송하면 이 가드 없이는 매번 [재등장] 이전상태=unknown이
    // 찍힘을 확인, 가드 추가 후 null(정상 무시)로 바뀜 - 반대로 isLive=true
    // (진짜 실시간)일 때의 진짜 재등장(T0480 사고사례, v1.46-A 목적)은
    // 그대로 정상 동작함도 같이 검증. isLive===false(리플레이 중)이면
    // 판단을 보류하고, 실시간으로 전환된 뒤 최신 정보로만 재등장을 확정한다.
    if (!isLive) return;
    reappearedDiag = '[재등장] 이전상태=' + reappearStatus;
    removeRowFromState(existingRow); // missing 상태로 남아있던 낡은 행 제거 - rowsByKey도 같이 정리되므로 아래서 새로 추가해도 절대 어긋나지 않음
  }

  var row = {
    item: sig.item,
    // [2026-07-19 신규][로그파일 분리] 종목×월물별로 로그 파일이 나뉘면서,
    // 브릿지가 "이 신호가 어느 파일(=어느 월물)에서 왔는지"를 함께
    // 보내줍니다. 없으면(과거 마이그레이션 전 기록 등) "-"로 표시.
    contract: sig.contract || '-',
    tf: sig.label,
    tfNum: tfNumber(sig.label),
    kind: sig.kind,
    date: sig.date,
    time: sig.time,
    datetime: sig.date + " " + sig.time,
    kst: chicagoToKST(sig.date, sig.time),
    // [신규][2026-09-07][꼭지점봉 서버시간+높이] 달성/무효 판정의 실제
    // 기준가(SB)가 확정된 꼭지점봉의 원본 서버시각+높이. 신호검색 스크립트가
    // 9/10번째 필드로 실어보낸다 - 구버전 로그(이 필드 없음)와의 하위호환을
    // 위해 없으면 빈 문자열로 둔다("가격시간" 칸이 빈 값을 알아서 표시).
    apexDateTime: sig.apexDateTime || '',
    apexHeight: (sig.apexHeight !== undefined && sig.apexHeight !== '' && sig.apexHeight !== null) ? parseFloat(sig.apexHeight) : null,
    // [신규][2026-09-10][목표삼각형 선행평탄구간/뾰족여부] 신호검색
    // 스크립트가 11/12번째 필드로 실어보낸다 - 구버전 로그(이 필드 없음)와의
    // 하위호환을 위해 없으면 null로 둔다("가격시간" 칸이 이
    // 필드가 null이면 표시를 생략).
    leftFlatRun: (sig.leftFlatRun !== undefined && sig.leftFlatRun !== '' && sig.leftFlatRun !== null) ? parseInt(sig.leftFlatRun, 10) : null,
    apexSharp: (sig.apexSharp === true) ? true : (sig.apexSharp === false ? false : null),
    // [신규][2026-09-18][예쁜삼각형/다이아몬드 배지] 신호검색 스크립트가
    // 13번째 필드로 실어보낸다 - 구버전 로그(이 필드 없음)와의 하위호환을
    // 위해 없으면 false로 둔다(다이아몬드 안 그림).
    isPrettyTriangle: !!sig.isPrettyTriangle,
    // [신규][2026-09-26][흰다이아몬드 배지] 등록 시점엔 판정 불가(오른쪽
    // 구름대는 미래 데이터가 필요) - PRETTY2_CONFIRMED 이벤트가 나중에
    // 도착하면 pretty2ByPk에서 이 행을 찾아 true로 갱신한다(addSignal 참고).
    prettyTriangle2: (function(){ var v = pretty2ByPk[sig.item] && pretty2ByPk[sig.item][sig.label + '|' + sig.kind + '|' + sig.date + '|' + sig.time + '|' + Number(sig.price).toFixed(2)]; return v === true; })(),
    // [신규][2026-09-26][케이스분리] 위 prettyTriangle2와 같은 pk로 케이스
    // 문자열을 찾아온다 - PRETTY2_CONFIRMED가 이 행 생성보다 먼저 도착한
    // 경우(재연결 등)까지 커버.
    prettyTriangle2Cases: (function(){ var v = pretty2CasesByPk[sig.item] && pretty2CasesByPk[sig.item][sig.label + '|' + sig.kind + '|' + sig.date + '|' + sig.time + '|' + Number(sig.price).toFixed(2)]; return v || ''; })(),
    price: parseFloat(sig.price),
    isConfirmed: false,
    confirmedList: '',
    achieveStatus: null, // null(대기중) | "achieved"(달성) | "invalid"(무효)
    reason: '', // [2026-07-21 추가] 달성/무효 판정 사유 (아직 감시중이면 빈값)
    // [2026-08-18 추가][왼쪽평탄5봉이상 별표] 신호검색 스크립트가 7번째
    // 필드로 실어보낸 값 - true면 삼각형 왼쪽 평탄구간이 5봉 이상이었다는 뜻.
    leftFlatStar: parseFloat(sig.starLevel) || 0,
    // [2026-08-19 추가][철회복원] 예전에 철회됐다가 다시 검색돼 복원된 신호인지
    wasRestored: !!sig.wasRestored,
    // [진단용][2026-08-31] seenKeys 영구차단 우회로 재등장 인정된 행이면
    // 표시 - 다음에 이런 시간역전 증상이 또 나오면 이 문구가 사유칸에
    // 뜨는지만 보면 재등장 로직이 실제로 탔는지 콘솔 없이 바로 확인 가능.
    reappearedDiag: reappearedDiag
  };
  addRowToState(row, key); // [근본수정][2026-09-20] 직접 push 대신 공용함수 - allRows와 rowsByKey가 항상 같이 채워짐
  updateItemFilterOptions();
  updateConfirmStars();

  // 🔔 알림: 과거기록 전송 중(isLive=false)이 아니라 진짜 실시간으로
  // 새로 도착한 신호에만 알림을 띄웁니다 (처음 접속시 쌓여있던 과거
  // 신호 수백 개에 대해 알림이 우수수 뜨는 걸 방지).
  if (isLive && notifyEnabled) {
    notifySingle(row);
  }
  scheduleRender();
}

function updateItemFilterOptions(){
  var box = document.getElementById('filterItemsBox');
  var existing = new Set(Array.from(box.querySelectorAll('input')).map(function(el){return el.value;}));
  var items = Array.from(new Set(allRows.map(function(r){return r.item;})));
  items.forEach(function(it){
    if (!existing.has(it)) {
      var label = document.createElement('label');
      var chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.className = 'itemChk';
      chk.value = it;
      chk.checked = true; // 새로 나타난 종목은 기본적으로 체크(전체선택) 상태로 추가
      chk.onchange = render;
      label.appendChild(chk);
      label.appendChild(document.createTextNode(' ' + abbreviateItem(it)));
      label.title = it; // 필터 라벨도 줄여서 보여주되, 마우스 올리면 원래 종목명 확인 가능
      box.appendChild(label);
    }
  });
}

// [2026-08-27 추가][종목 약칭] 표/필터 모두 한 글자로 줄여서 보여준다
// (나스닥100->N, SP500->S, GOLD->G). 목록에 없는 새 종목이 추가돼도
// 깨지지 않도록, 매핑에 없으면 원래 이름의 첫 글자로 자동 대체한다
// (특정 종목명을 코드 곳곳에 하드코딩하지 않는 기존 설계 원칙 유지).
var ITEM_ABBR_MAP = { 'NASDAQ100': 'N', 'SP500': 'S', 'GOLD': 'G' };
function abbreviateItem(name){
  if (!name) return name;
  if (ITEM_ABBR_MAP[name]) return ITEM_ABBR_MAP[name];
  return name.charAt(0).toUpperCase();
}

// ============================================================
// [2026-07-19 신규] 종목별 월물 선택 + D-day 표시 헤더.
// bridge_signals.py의 get_contracts로 contracts.json 내용을 받아서,
// 종목마다 "활성/다음월물 중 뭘 보고 싶은지" 고를 수 있는 드롭다운과
// 만기까지 D-day를 보여줍니다. 여기서 고른 월물은 표(테이블)의
// 필터로도 그대로 적용됩니다(item 체크박스와 별개로 추가 필터링).
// ============================================================
var contractsConfig = {};      // slug -> {nameKr, nameEnDefault, active:{...}, next:{...}}
var itemToSlug = {};           // 표시종목명 -> data/ 폴더슬러그 역매핑(contracts.json 키 기준, 특정 종목명 하드코딩 없음)
var selectedContracts = {};    // slug -> "U26" 같은 선택된 월물 라벨, 또는 "" (=전체/필터 안 함)

function handleContractsData(instruments){
  contractsConfig = instruments;
  itemToSlug = {};
  Object.keys(instruments).forEach(function(slug){
    var inst = instruments[slug];
    itemToSlug[inst.nameEnDefault] = slug;
    // 아직 아무것도 선택 안 돼있으면 기본값은 활성월물
    if (selectedContracts[slug] === undefined) {
      selectedContracts[slug] = inst.active ? inst.active.label : "";
    }
  });
  renderContractHeader();
  render();
}

function daysUntil(dateStr){
  if (!dateStr) return null;
  var target = new Date(dateStr + 'T00:00:00');
  if (isNaN(target.getTime())) return null;
  var now = new Date();
  var diffMs = target.setHours(0,0,0,0) - now.setHours(0,0,0,0);
  return Math.round(diffMs / 86400000);
}

function ddayHtml(dateStr){
  var d = daysUntil(dateStr);
  if (d === null) return '';
  var cls = 'cc-dday';
  var text;
  if (d < 0) { text = '만기지남(' + Math.abs(d) + '일 전)'; cls += ' dday-soon'; }
  else if (d === 0) { text = '오늘 만기'; cls += ' dday-soon'; }
  else {
    text = 'D-' + d;
    if (d <= 3) cls += ' dday-soon';
    else if (d <= 7) cls += ' dday-warn';
  }
  return '<span class="' + cls + '">' + text + '</span>';
}

function ddayPlainText(dateStr){
  var d = daysUntil(dateStr);
  if (d === null) return '';
  if (d < 0) return '만기지남(' + Math.abs(d) + '일 전)';
  if (d === 0) return '오늘 만기';
  return 'D-' + d;
}

function renderContractHeader(){
  var root = document.getElementById('contractBar');
  var slugs = Object.keys(contractsConfig);
  if (slugs.length === 0) {
    root.innerHTML = '';
    return;
  }
  var html = '';
  slugs.forEach(function(slug){
    var inst = contractsConfig[slug];
    var active = inst.active, next = inst.next;
    var selected = selectedContracts[slug] || (active ? active.label : "");
    // [2026-07-23 변경] 종목코드+콤보박스 구조. 만기일(D-day)은 제목
    // 옆이 아니라 콤보박스 각 옵션 텍스트 안에 "월물코드 N월물 D-일수"
    // 형태로 포함. "활성"/"다음월물" 단어는 표시하지 않음.
    html += '<div class="contract-card" data-slug="' + slug + '">';
    html += '<div class="cc-title">' + (inst.nameEnDefault || inst.nameKr) + '</div>';
    html += '<select class="cc-select" data-slug="' + slug + '">';
    if (active) {
      html += '<option value="' + active.label + '"' + (selected === active.label ? ' selected' : '') + '>' +
        active.label + ' ' + active.monthLabel + ' ' + ddayPlainText(active.lastTradingDay) + '</option>';
    }
    if (next) {
      html += '<option value="' + next.label + '"' + (selected === next.label ? ' selected' : '') + '>' +
        next.label + ' ' + next.monthLabel + ' ' + ddayPlainText(next.lastTradingDay) + '</option>';
    }
    html += '</select>';
    html += '</div>';
  });
  root.innerHTML = html;

  root.querySelectorAll('.cc-select').forEach(function(sel){
    sel.addEventListener('change', function(){
      selectedContracts[this.dataset.slug] = this.value;
      renderContractHeader();
      render();
    });
  });
}


// [2026-07-17 대개편] 별표 판정 기준을 사용자 요청대로 전면 수정:
//   1) BULL/BEAR는 이제 절대 안 섞입니다 - 방향까지 같아야 "일치"로 칩니다.
//      (예전엔 방향 안 따지고 가격만 같으면 묶여서, BULL과 BEAR가 우연히
//      같은 가격이라는 이유만으로 별이 붙는 문제가 있었음 - 수정함)
//   2) 반대로 분봉/틱봉 구분은 이제 없앴습니다 - 분봉과 틱봉이 같은
//      가격에서 겹쳐도 "일치"로 인정됩니다. 다만 그 경우 구분이 되도록
//      별 색을 흰색으로 표시합니다(아래 render()의 confirm-star-mixed
//      클래스 참고).
//   3) [2026-07-27 수정] 일치 개수에 따라 별표를 반 칸 단위로 세분화:
//      2개=★☆(0.5칸), 3개=★★☆☆(1칸), 4개=★★★☆(1.5칸),
//      5개 이상=★★★★(2칸, 최대). 반 칸 렌더링은 render()의
//      buildConfirmStarHtml() 참고(빈 별 위에 채운 별을 겹쳐서 표현).
//   4) "같은 가격 + 같은 타임프레임인데 신호세기(1/2)만 다른 것"은 원래
//      부터 타임프레임 라벨(예: T0030) 기준으로 묶여서 자동으로 1개로
//      취급됩니다 - kind(세기)는 그룹핑에 아예 안 씀.
function updateConfirmStars(){
  var groups = {};
  // [근본수정][철회/달성된 행 자신의 별표가 옛날값에 박제되는 버그]
  // 예전엔 achieveStatus!==null인 행을 그룹 계산에서 빼기만 하고 그 행
  // 자신의 starCount/confirmedList는 손을 안 대서, 철회/달성된 행 자체가
  // "예전에 몇 개 그룹이었을 때"의 별표를 화면에 계속 그대로 보여주고
  // 있었다(실제 지적사항: 실제 묶여있는건 2개인데 철회된 행은 6개짜리
  // 별표를 계속 표시). 매번 전체를 다시 계산하는 함수이므로, 시작할 때
  // 먼저 모든 행의 별표 관련 필드를 초기화해서 "이번 계산에 안 걸리면
  // 빈 상태"가 기본이 되도록 한다.
  // [근본수정][네모와 기준배열이 달라서 개수가 서로 다르게 나오던 버그]
  // 네모(묶어보기, renderRowsWithGrouping/groupKeyOf)는 필터 적용된 rows를
  // 기준으로 세는데, 이 함수는 필터 무시하고 allRows(전체) 기준으로 세고
  // 있었다 - 같은 item+price+방향 키를 쓰는데도 순회대상이 달라서, 필터
  // 상태에 따라 네모와 별표 개수가 서로 다르게 표시되는 문제였다(실제
  // 지적사항: T0060/T0050 - 네모 "2건" vs 별표 "T0040,T0050,T0060" 3개).
  // render()가 applyFilters() 직후 이 함수를 부르므로, 전역 rows(필터
  // 적용된 최신값)가 이미 준비돼있다 - allRows 대신 이걸 쓴다.
  allRows.forEach(function(r){ r.isConfirmed = false; r.confirmedList = ''; r.starCount = 0; r.confirmMixed = false; r.matchCount = 0; });
  rows.forEach(function(r){
    // [근본수정][달성/무효/철회된 행도 카운트에 섞이는 버그] 실시간 중
    // 달성/무효/철회된 신호는 allRows에서 지워지지 않고 achieveStatus만
    // 바뀐 채로 남아있는다(고정된 행과 동일 - 진행과정을 계속 보여주기
    // 위한 의도적 설계). 근데 이 함수가 achieveStatus를 전혀 안 가리고
    // 무조건 다 세고 있어서, 이미 철회된 신호까지 "아직 일치하는 대기중
    // 신호"인 것처럼 별표/일치목록에 계속 포함되는 문제가 있었다(실제
    // 지적사항: 7개 중 3개 철회됐는데도 목록에 7개 그대로 표시). 아직
    // 대기중(achieveStatus===null)인 것만 센다.
    if (r.achieveStatus !== null) return;
    var dir = r.kind.indexOf('BULL') === 0 ? 'BULL' : 'BEAR';
    // [수정] 그룹 키에서 분봉/틱봉 구분(unit)을 빼고, 대신 방향(dir)을 넣음.
    var key = r.item + '|' + r.price.toFixed(2) + '|' + dir;
    if (!groups[key]) groups[key] = [];
    groups[key].push(r);
  });
  Object.keys(groups).forEach(function(key){
    var arr = groups[key];
    // [수정] tfNum(숫자)이 아니라 타임프레임 라벨 전체(예: "M0030"/"T0030")로
    // 구분합니다. tfNum만 쓰면 "30분봉"과 "30틱봉"이 숫자가 같다는
    // 이유로 같은 것으로 잘못 합쳐지는 문제가 생겨서, 라벨 전체를 씁니다.
    // (세기(1/2)는 애초에 라벨에 안 들어있으니, 세기만 다른 건 자동으로 1개로 묶임)
    var distinctTfLabels = Array.from(new Set(arr.map(function(r){ return r.tf; })));
    if (distinctTfLabels.length >= 2) {
      distinctTfLabels.sort(); // "M0030" < "M0090" < "T0030" - 0채움 덕분에 문자열 정렬로 충분
      var hasMin = distinctTfLabels.some(function(tf){ return tf.charAt(0) === 'M'; });
      var hasTick = distinctTfLabels.some(function(tf){ return tf.charAt(0) === 'T'; });
      var mixed = hasMin && hasTick; // 분봉+틱봉이 섞여서 일치한 경우 -> 흰 별
      var n = distinctTfLabels.length;
      var starCount = Math.min((n - 1) * 0.5, 2); // 2->0.5, 3->1, 4->1.5, 5개 이상->2(최대)
      var list = distinctTfLabels.join(', ');
      // [수정][2026-09-27][사용자 지적 - 세기(1/2)도 따로 세야 함] 마우스오버
      // 툴팁(list)은 그대로 "일치하는 타임프레임" 정보만 보여주면 되지만
      // (세기까지 나열하면 툴팁이 지저분해짐), 배지에 찍히는 숫자는 실제로
      // 화면에 별도 행으로 떠있는 신호 개수와 맞아야 한다 - 같은 타임프레임에
      // BULL1/BULL2처럼 세기만 다른 신호가 동시에 대기중이면 그것도 각각
      // 별개 행으로 보이므로(예: M0014가 BULL1/BULL2 둘 다 대기중이면 2행),
      // distinctTfLabels(라벨 기준 중복제거, 세기는 뭉개짐) 대신 arr.length
      // (그룹 안의 실제 행 개수, 세기 포함 그대로)를 숫자로 쓴다. "일치
      // 여부" 게이트(위 distinctTfLabels.length>=2)는 그대로 "서로 다른
      // 타임프레임이 최소 2개는 있어야 진짜 교차확인"이라는 의미를 유지.
      arr.forEach(function(r){
        r.isConfirmed = true; r.confirmedList = list; r.starCount = starCount; r.confirmMixed = mixed; r.matchCount = arr.length;
      });
    } else {
      arr.forEach(function(r){ r.isConfirmed = false; r.confirmedList = ''; r.starCount = 0; r.confirmMixed = false; r.matchCount = 0; });
    }
  });
}

// [2026-07-27 추가] 엑셀 저장은 CSS 오버레이를 못 쓰는 순수 텍스트라,
// 반 칸을 '½' 기호로 붙여서 표현합니다.
// [2026-08-18 수정] 기본은 네모(■), 이 신호가 왼쪽평탄5봉이상(leftFlatStar)
// 이면 네모 대신 별(★)로 모양만 바꿔서 표시합니다(별도 아이콘 추가 아님).
function buildConfirmStarText(r){
  if (!r.isConfirmed || !r.starCount) return '';
  var whole = Math.floor(r.starCount);
  var half = (r.starCount - whole) >= 0.5;
  return '★'.repeat(whole) + (half ? '½' : '');
}

function buildConfirmStarHtml(r){
  if (!r.isConfirmed || !r.starCount) return '';

// [2026-07-17 추가] 신호 하나의 "지금 시점 달성여부 상태"를 계산합니다.
// render()에서 ✅/❌/⏳/⚠️ 아이콘을 그릴 때 쓰던 판정 로직을 그대로
// 함수로 뽑아낸 것 - 필터 체크박스도 정확히 같은 기준으로 걸러야
// "화면에 보이는 아이콘"과 "체크박스로 감추는 기준"이 어긋나지 않습니다.
// 반환값: "achieved" | "invalid" | "waiting" | "missing" | "unknown"
//   (unknown = 그 종목·소스의 하트비트를 아직 한 번도 못 받아서 대기중/
//    빠짐 여부조차 판단할 근거가 없는 상태 - 화면에는 빈 칸으로 표시됨)
// [2026-07-23 추가] STATUS_ACHIEVED/STATUS_INVALID/STATUS_RETRACTED 문자열을
// allRows에 저장하는 achieveStatus 값("achieved"/"invalid"/"retracted")으로
// 변환하는 공용 헬퍼. addSignal() 두 곳에서 공유합니다.
function statusKindToAchieveStatus(kind){
  if (kind === "STATUS_ACHIEVED") return "achieved";
  if (kind === "STATUS_RETRACTED") return "retracted";
  return "invalid";
}

function effectiveAchieveStatus(r){
  if (r.achieveStatus === 'achieved') return 'achieved';
  if (r.achieveStatus === 'invalid') return 'invalid';
  // [2026-07-23 추가] STATUS_RETRACTED: 정확도점검이 authoritative
  // 데이터로 재검증한 결과 애초에 신호가 아니었음이 확인된 경우.
  // 달성/무효/대기중/빠짐 어디에도 안 섞이게 별도 상태로 구분.
  if (r.achieveStatus === 'retracted') return 'retracted';
  var pkSource = (r.tf && r.tf.charAt(0) === 'T') ? 'tick' : 'min';
  var pk = r.tf + '|' + r.kind + '|' + r.date + '|' + r.time + '|' + r.price.toFixed(2);
  // [2026-08-26 신규][근본버그 수정 - 옛 제거기록 무효화] removalLogByPk는
  // pk당 딱 1개 기록만 영구 보관하는데, 이 pk가 나중에(예: RESET_WIPED
  // 이후 워밍업 재발견으로) 재등록돼서 지금 최신 하트비트에 살아있어도
  // 이 옛 기록을 계속 최우선으로 봐서 정상감시 중인 신호가 영구히
  // "🗑️(설명된 제외)"로 잘못 고정되는 사고가 실제로 확인됐다(재시작
  // 초기화로 지워졌다가 재등록된 정상신호가 계속 그 표시로 남음).
  // "지금 이 순간 최신 하트비트에 살아있는지"를 먼저 확인해서, 살아
  // 있으면 과거 제거기록이 이미 무효화된 것으로 보고 무시한다 - 최신
  // 생존여부가 항상 과거 스냅샷보다 우선해야 한다.
  var keySetNow = lastPendingKeys[pkSource][r.item];
  var isCurrentlyAlive = !!(keySetNow && keySetNow.has(pk));
  var removalMapEarly = removalLogByPk[r.item];
  var removalEntryEarly = removalMapEarly ? removalMapEarly[pk] : null;
  if (removalEntryEarly && !isCurrentlyAlive) {
    if (removalEntryEarly.reasonCode === 'ACHIEVED') return 'achieved';
    if (removalEntryEarly.reasonCode === 'INVALID') return 'invalid';
    if (removalEntryEarly.reasonCode === 'RETRACTED') return 'retracted';
    // RESET_WIPED 등 그 외 사유는 "missing"이 아니라 별도 상태로 -
    // 화면에서 사유칸이 이미 정확한 설명을 붙여주므로, achieve 마크
    // 판정만 "정상적으로 설명된 제외"로 명확히 구분해준다.
    return 'explained_removal';
  }
  if (!lastPendingKeysReceived[pkSource][r.item]) return 'unknown';
  // [2026-07-28 추가][버그수정] 가장 최근 하트비트 스냅샷이 이 신호의
  // 발생시각보다 "이전"이면, 그 스냅샷에 이 신호가 없는 게 당연합니다
  // (아직 등록될 기회조차 없었음). 이 경우를 missing(⚠️)으로 잘못
  // 표시하지 않고, unknown(판단 근거 없음)으로 처리합니다.
  // [2026-08-11 버그수정][근본원인] 위 판단에 r.date/r.time(신호의 "봉"
  // 시각)을 그대로 썼던 게 실제 오진단의 원인이었습니다. 틱봉 신호는
  // 워밍업 때 며칠 전 과거 봉에서도 새로 검색되는데, 봉 시각은 며칠
  // 전이어도 실제 등록(pendingSignals에 들어간) 시각은 방금(이번 세션
  // 워밍업)입니다. 봉 시각만 보고 비교하면 "하트비트가 신호(봉)보다
  // 늦게 왔다 -> 이미 있었어야 하는데 없다 -> missing"으로 잘못 판정돼,
  // 방금 새로 찾은 신호가 첫 하트비트부터 곧장 ⚠️(감시목록에서 빠짐)로
  // 뜨는 문제가 있었습니다. 실제 등록 시각(SAVE_SCHEDULED 이벤트,
  // saveTrackingByPk)이 있으면 그걸 기준으로 삼고, 없을 때만(구버전
  // 로그 등) 봉 시각으로 폴백합니다.
  var signalRawStr = r.date + ',' + r.time;
  var actualRegRawStrForStatus = signalRawStr;
  (function () {
    var stMap = saveTrackingByPk[r.item];
    var stEntry = stMap ? stMap[r.tf + "|" + r.kind + "|" + r.date + "|" + r.time + "|" + Number(r.price).toFixed(2)] : null;
    if (stEntry && stEntry.scheduled) {
      actualRegRawStrForStatus = stEntry.scheduled.dateRaw + ',' + stEntry.scheduled.timeRaw;
    }
  })();
  var lastHb = lastHeartbeatSeenAt[pkSource][r.item];
  if (lastHb && lastHb.raw < actualRegRawStrForStatus) return 'unknown';
  return isCurrentlyAlive ? 'waiting' : 'missing';
}

// [2026-07-21 추가][버그 수정] 이 함수를 화면 필터링(applyFilters)과
// 알림 트리거(addSignal) 양쪽에서 공용으로 씁니다. 예전엔 알림이 이
// 로직을 전혀 안 거치고 무조건 떠서, 화면에서 종목/방향/신호세기/
// 달성상태를 걸러놔도 알림은 그 필터와 무관하게 울렸습니다.
function rowPassesFilters(r, checkedItems, allItemChks, checkedKinds, checkedDirs, checkedAchieve, minDate){
  if (allItemChks.length > 0 && !checkedItems.has(r.item)) return false;
  var slugForRow = itemToSlug[r.item];
  if (slugForRow && selectedContracts[slugForRow] && r.contract && r.contract !== '-') {
    if (r.contract !== selectedContracts[slugForRow]) return false;
  }
  var level = r.kind.slice(-1);
  if (!checkedKinds.has(level)) return false;
  var dir = r.kind.indexOf('BULL') === 0 ? 'BULL' : 'BEAR';
  if (!checkedDirs.has(dir)) return false;
  if (!checkedAchieve.has(effectiveAchieveStatus(r))) return false;
  if (minDate && (r.kst || '').slice(0, 10) < minDate) return false;
  return true;
}

// 지금 이 순간의 필터 체크박스 상태를 그대로 읽어서 조건 묶음을 만듭니다.
// (applyFilters 내부와 알림 트리거 양쪽에서 매번 새로 호출)
function currentFilterState(){
  var checkedItems = new Set(Array.from(document.querySelectorAll('.itemChk:checked')).map(function(el){return el.value;}));
  var allItemChks = document.querySelectorAll('.itemChk');
  var checkedKinds = new Set(Array.from(document.querySelectorAll('.kindChk:checked')).map(function(el){return el.value;}));
  var checkedDirs = new Set(Array.from(document.querySelectorAll('.dirChk:checked')).map(function(el){return el.value;}));
  var checkedAchieve = new Set(Array.from(document.querySelectorAll('.achieveChk:checked')).map(function(el){return el.value;}));
  var daysF = parseInt(document.getElementById('filterDays').value, 10) || 0;
  var minDate = daysF > 0 ? daysAgoKST(daysF) : null;
  return { checkedItems: checkedItems, allItemChks: allItemChks, checkedKinds: checkedKinds, checkedDirs: checkedDirs, checkedAchieve: checkedAchieve, minDate: minDate };
}

function applyFilters(){
  var f = currentFilterState();
  var source = allRows;
  rows = source.filter(function(r){
    return rowPassesFilters(r, f.checkedItems, f.allItemChks, f.checkedKinds, f.checkedDirs, f.checkedAchieve, f.minDate);
  });
}

function cmpByKey(a, b, key, dir){
  // [2026-07-16 추가] "달성" 칼럼은 값이 null(아직 감시중) | "achieved" |
  // "invalid" 세 가지뿐이라, 일반 문자열 비교(< / >)로는 null이 섞이면
  // 순서가 뒤죽박죽이 됩니다. 그래서 이 칼럼만 따로 "감시중(null)이
  // 항상 먼저 오도록" 순위를 매겨서 비교합니다. (기본 오름차순 클릭
  // 한 번이면 감시중이 맨 위로 옵니다)
  if (key === 'achieveStatus') {
    var rank = function(v){ return v ? 1 : 0; }; // null(감시중) -> 0, achieved/invalid -> 1
    var ar = rank(a[key]), br = rank(b[key]);
    if (ar !== br) return (ar - br) * dir;
    return 0;
  }
  var av = a[key], bv = b[key];
  if (av < bv) return -1 * dir;
  if (av > bv) return 1 * dir;
  return 0;
}

function sortArray(arr){
  arr.sort(function(a, b){
    for (var i = 0; i < sortKeys.length; i++){
      var c = cmpByKey(a, b, sortKeys[i].key, sortKeys[i].dir);
      if (c !== 0) return c;
    }
    return 0;
  });
}

// 지금 이 순간의 "한국시간(KST) 기준 오늘 날짜"를 "YYYY-MM-DD" 형태로 반환합니다.
// 매번 render()에서 새로 계산하므로, 자정을 넘기면 자동으로 다음날 기준으로 바뀝니다.
function todayKST(){
  return new Date().toLocaleDateString('sv-SE', {timeZone:'Asia/Seoul'}); // "YYYY-MM-DD"
}

// 위와 동일하되 "어제" 날짜를 반환합니다 (KST 기준 오늘에서 24시간을 뺀 시점의 날짜).
function yesterdayKST(){
  var d = new Date(Date.now() - 24*60*60*1000);
  return d.toLocaleDateString('sv-SE', {timeZone:'Asia/Seoul'});
}

// N일 전(오늘 포함 N일째 되는 날)의 KST 날짜를 반환합니다.
// 예: daysAgoKST(1) = 오늘, daysAgoKST(2) = 어제, daysAgoKST(6) = 6일 전
// "N일 필터"에서 "오늘부터 거슬러 N일치"의 시작 경계선(가장 오래된 날짜)을
// 구하는 데 씁니다.
function daysAgoKST(n){
  var d = new Date(Date.now() - (n - 1) * 24*60*60*1000);
  return d.toLocaleDateString('sv-SE', {timeZone:'Asia/Seoul'});
}

function render(){

        // 행과 실제 꺼내오는 데이터가 어긋날 수 있는 구조적 취약점이었다
        // (실제사례: 클릭한 행과 전혀 다른 등록시각의 이력이 뜨는 현상
        // 확인). 그 행 자기 자신의 고유키(tf|kind|date|time|price)로
        // 저장/조회하도록 바꿔서, 렌더 순서가 어떻게 되든 항상 그 행
        // 자신의 데이터만 정확히 가져오게 구조적으로 보장한다.
        var histKeyStored = r.tf + '|' + r.kind + '|' + r.date + '|' + r.time + '|' + r.price.toFixed(2);
        // [2026-09-14 추가][상태이력 모달 줄바꿈] "달성확인(...)@가격[fn=...]"처럼
        // 가격 뒤에 공백 없이 판정근거([fn=...])가 바로 붙는 줄은 기존엔 pre-wrap이
        // 끊을 공백이 없어 옆으로 길게 밀려나가며 가로스크롤이 생겼음 - [fn= 앞에
        // 줄바꿈을 넣어 "가격까지는 그 줄에, 근거는 다음 줄"로 보이게 함.
        // [2026-09-25 수정][FRAME_SHIFT_SUSPECT 중복표시 제거] 프레임밀림 의심
        // 정보는 이제 사유칸에 별도로("⚠ 표시=X-실제#주기=Y") 정리해서 보여주므로,
        // 이 모달(전체 상태이력)에까지 원문 그대로("[WARM[FRAME_SHIFT_SUSPECT:...]]"
        // 이중 대괄호, 번역도 안 됨) 뜰 필요가 없다 - registeredSourceTag()가
        // 이미 쓰는 것과 동일한 정규식으로 여기서도 제거한다.
        var histRawTextClean = stripFrameShiftSuspect(histRawText);
        window.__histData[histKeyStored] = koDisplay(histRawTextClean).split(' -> ').join('\n').split('[fn=').join('\n[fn=');
        var histKeyEsc = histKeyStored.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
        histBtnHtml = ' <button class="histBtn" data-histkey="' + histKeyEsc + '" title="전체 이력 보기" style="cursor:pointer; background:none; border:none; color:var(--amber,#f2a93b); font-size:20px; line-height:1; vertical-align:middle; padding:0 2px; display:inline-block;">\u25be</button>';
      }
      // [2026-07-27 추가][화면표시 한글화] 로그파일/사유데이터 자체는
      // 인코딩 문제 때문에 영어를 유지해야 하지만, 대시보드는 브라우저라
      // 그 문제가 없습니다. 그래서 여기서 "화면에 보여주기 직전"에만
      // 알려진 영어 용어/코드를 한글로 바꿔치기합니다 - 원본 데이터(r.reason
      // 등)는 안 건드리고 표시용 문자열만 변환합니다.
      // [신규][2026-09-23][프레임밀림 의심 표시] REGISTERED 이벤트의 source
      // 필드에 실려온 FRAME_SHIFT_SUSPECT(#주기 지표로 감지한 밀림 의심)를
      // 사유칸에도 노출한다 - 기존엔 모달(상태이력)에서만 보였음. 밀린
      // 것으로 의심되는 신호에만 붙고, 정상 신호는 그대로 기존 사유만 표시.
      var __fsTag = getRawRegisteredSource(r);
      // [수정][2026-09-29][스크립트 v5.12 - 구분자 ";"->"_"로 교체에 맞춤]
      // 스크립트 쪽에서 "disp=X;actual=Y" 안의 ";"가 HEARTBEAT
      // pendingDetails의 신호 구분자(";")와 충돌해 그 신호의 저장예약/
      // 눌림확인 등 이후 이력이 통째로 사라지는 근본버그가 있어 "_"로
      // 바꿨다(스크립트 쪽 근본수정과 세트). 이미 파일에 남아있는 구버전
      // 로그(";" 형식)도 계속 정상 표시되게 둘 다 허용.
      var __fsMatch = __fsTag && __fsTag.match(/FRAME_SHIFT_SUSPECT:disp=(\d+)[;_]actual=(\d+)/);
      var __fsNoteHtml = '';
      if (__fsMatch) {
        var __fsUnit = (r.tf && r.tf.indexOf('T') === 0) ? '틱' : '분'; // [신규] 라벨 접두문자(T=틱봉, M=분봉)로 단위 추정
        // [수정][사용자 요청] 사유칸 기본 글씨(11px, 회색 #aaa)보다 눈에 안
        // 띈다는 지적 - 타임프레임 칸과 동일한 글씨형식(기본 크기12px,
        // 기본 텍스트색)으로 별도 span에 담아, escape 처리 이후(reasonEsc
        // 조합시)에 붙인다 - 안 그러면 <span> 태그 자체가 문자로 escape돼
        // 화면에 그대로 찍혀버림.
        // [수정][2026-09-25][사용자 요청] "⚠ 표시=X-실제#주기=Y" -> "⚠ 주기=Y-표시=X"로 순서/표현 변경(#주기 실측값을 먼저, 원래 요청표시값을 뒤에).
        __fsNoteHtml = '<span style="font-size:12px; color:var(--text); font-weight:bold;">⚠ 주기=' + __fsMatch[2] + __fsUnit + '-표시=' + __fsMatch[1] + __fsUnit + '</span>' + (reasonText ? ' / ' : '');
      }
      reasonText = koDisplay(reasonText);
      var reasonEsc = __fsNoteHtml + String(reasonText).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + histBtnHtml;
      var rk = rowKey(r);
      var rkEsc = rk.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      var pinChecked = pinnedKeys.has(rk) ? ' checked' : '';
      // [신규][2026-09-29][고정된 묶음 표시, 사용자 요청] 이 신호는 아직
      // 고정 안 됐는데, 같은 그룹(종목+가격+방향)의 다른 신호가 이미
      // 고정돼있으면 체크박스에 파란 배경 클래스를 붙인다.
      var pinGroupCls = (!pinnedKeys.has(rk) && pinnedGroupKeys[groupKeyOf(r)]) ? ' pinChk-groupPinned' : '';
      html += '<tr' + rowCls + '><td><input type="checkbox" class="pinChk' + pinGroupCls + '" data-rowkey="' + rkEsc + '"' + pinChecked + '></td><td>' + achieveMark + '</td><td>' + starMark + '</td><td title="' + r.item + '">' + abbreviateItem(r.item) + '</td><td>' + r.contract + '</td><td>' + r.tf + '</td><td class="' + cls + '">' + r.kind +
        '</td><td>' + r.datetime + '</td><td>' + r.price.toFixed(2) + '</td><td>' + fmtApexCell(r) + '</td><td style="max-width:280px; font-size:11px; color:#aaa;">' + reasonEsc + '</td></tr>';
    } catch(e) {
      // 이 행 하나에 문제가 있어도 나머지 행 표시에는 영향 없게 건너뜁니다.
      // (예: 가격감시 스크립트가 아직 불안정해서 이상한 값을 보내는 경우 대비)
      console.error('행 렌더링 오류, 건너뜀:', e, r);
    }
  }

  // [2026-08-21 추가][묶어보기 - 상시적용] 같은 종목+가격+서버날짜+
  // 서버시각(초단위 동일)인 행이 여러 개면 - 서로 다른 촘촘한 틱주기가
  // 가격 변동 없는 구간에서 SA/SB가 우연히 같은 값이 되어 동시에 여러
  // 줄로 찍히는 현상 - 그중 시각이 가장 이른 신호 1개만 대표로 보여주고
  // 나머지는 접어둔다. 대표행 확인(별표)칸 앞 화살표를 클릭하면 나머지가
  // 대표행 바로 아래 펼쳐지고, 다시 누르면 접힌다.
  // [📌 고정과의 관계] 고정된 신호는 그 신호 하나만 개별로 맨 위 고정
  // 영역에 그대로 뜨고(그룹핑 대상에서 제외), 나머지 미고정 신호들은
  // 자기들끼리 다시 그룹핑된다 - 즉 고정은 "그 그룹에서 하나를 꺼내는"
  // 효과와 같다.
  // [2026-08-21 수정][별표 기준과 통일] 처음엔 종목+가격+날짜+시각(초)로
  // 묶었는데, 이미 있는 "다중타임프레임 확인" 별표(updateConfirmStars)가
  // 정확히 이 목적으로 종목+가격+방향(BULL/BEAR)을 기준으로 신호들을
  // 하나의 그룹으로 보고 있었다. 별표를 공유하는 신호는 곧 "같은 신호로
  // 취급되는 신호"이므로, 접기/묶기도 그 기준을 그대로 따라야 한다 -
  // 날짜/시각은 그룹 여부와 무관(별표 로직도 시각 제한이 없음).
  // [주의] 날짜/시각 제한이 없으므로, 같은 종목+가격이 며칠 간격을 두고
  // 우연히 재등장해도 하나의 그룹으로 접힌다 - 이는 별표 로직의 기존
  // 동작과 100% 동일하게 맞춘 것(새로운 제약이 아님).
  function groupKeyOf(r){
    var dir = r.kind.indexOf('BULL') === 0 ? 'BULL' : 'BEAR';
    return r.item + '|' + r.price.toFixed(2) + '|' + dir;
  }

  function renderRowsWithGrouping(rowList){
    var groupsMap = {}, order = [];
    rowList.forEach(function(r){
      var gk = groupKeyOf(r);
      if (!groupsMap[gk]) { groupsMap[gk] = []; order.push(gk); }
      groupsMap[gk].push(r);
    });
    order.forEach(function(gk){
      // [근본수정][그룹 내부 정렬 무시 버그] 예전엔 그룹 안 멤버를
      // datetime 기준으로 하드코딩해서 강제 정렬했다 - 사용자가 상단에서
      // 다른 정렬기준(예: 타임프레임)을 선택해도 그룹 안에서는 무시되고
      // 항상 시각순으로만 보였다(실제 지적사항). 별도의 정렬로직을 두는
      // 대신, 전체 테이블 정렬에 쓰는 sortArray(다중키 sortKeys 기반)를
      // 그대로 재사용한다 - 그룹 안이든 밖이든 항상 같은 하나의 정렬
      // 기준만 존재하게 되어, 둘이 어긋날 여지 자체가 없어진다.
      var members = groupsMap[gk].slice();
      sortArray(members);
      if (members.length === 1) { renderRow(members[0], null, null); return; }
      var representative = members[0];
      var rest = members.slice(1);
      var isExpanded = expandedGroupKeys.has(gk);
      renderRow(representative, { expanded: isExpanded, groupKey: gk, count: members.length }, isExpanded ? 'first' : null);
      if (isExpanded) rest.forEach(function(m, idx){ renderRow(m, null, idx === rest.length - 1 ? 'last' : 'mid'); });
    });
  }

  // 고정(📌)된 행은 그룹핑 없이 항상 개별로, 맨 위에 그대로 노출.
  var pinnedForRender = rows.filter(function(r){ return pinnedKeys.has(rowKey(r)); });
  var restForRender = rows.filter(function(r){ return !pinnedKeys.has(rowKey(r)); });
  // [신규][2026-09-29][고정된 묶음 표시] 고정된 행들의 그룹키를 미리
  // 모아둔다 - renderRow가 이걸로 "이 미고정 신호의 그룹에 이미 고정된
  // 형제가 있는지"를 판단한다(그룹에 신호가 1개뿐이었다면 고정되는 순간
  // 그 신호 자체가 여기로 옮겨와서 남는 미고정 형제가 없으므로 자연히
  // 아무 표시도 안 남는다).
  pinnedForRender.forEach(function(r){ pinnedGroupKeys[groupKeyOf(r)] = true; });
  pinnedForRender.forEach(function(r){ renderRow(r, null); });
  renderRowsWithGrouping(restForRender);

  tbody.innerHTML = html;

  // [신규][2026-09-29][고정된 묶음 표시] indeterminate는 HTML 속성이 아니라
  // JS/DOM 프로퍼티라 위 html 문자열에 직접 못 넣는다 - innerHTML 대입 직후
  // 여기서 해당 체크박스들에 켜준다. 이러면 브라우저가 "고정 체크박스가
  // 체크됐을 때"와 완전히 동일한 파란 렌더링(accent-color 포함)을 쓰되,
  // 안의 표시만 체크(✓) 대신 가로선(─)으로 그려서 갈고리가 빠진 것과
  // 같은 효과를 낸다(색을 따로 만들지 않고 네이티브 렌더링 그대로 재사용).
  document.querySelectorAll('.pinChk-groupPinned').forEach(function(chk){ chk.indeterminate = true; });

  // [2026-08-21 추가][묶어보기] 별표 앞 화살표 클릭 -> 펼치기/접기 토글
  document.querySelectorAll('.group-toggle-arrow').forEach(function(el){
    el.onclick = function(ev){
      ev.stopPropagation();
      var k = this.dataset.groupkey;
      if (expandedGroupKeys.has(k)) expandedGroupKeys.delete(k); else expandedGroupKeys.add(k);
      render();
    };
  });

  // [2026-07-23 추가][신호 고정] 체크박스 클릭 시 고정/해제하고 즉시
  // 다시 그림(고정된 행은 다음 render()에서 맨 위로 올라감).
  document.querySelectorAll('.pinChk').forEach(function(chk){
    chk.onchange = function(){
      var k = this.dataset.rowkey;
      if (this.checked) pinnedKeys.add(k); else pinnedKeys.delete(k);
      savePinnedKeys();
      render();
    };
  });

  // [2026-07-30 추가][상태이력 모달 열기] 화살표 버튼 클릭 시 저장해둔
  // window.__histData에서 해당 인덱스의 전체 이력 텍스트를 꺼내 모달에 표시.
  document.querySelectorAll('.histBtn').forEach(function(btn){
    btn.onclick = function(){
      var key = this.dataset.histkey;
      var text = (window.__histData && window.__histData[key]) ? window.__histData[key] : '(이력 없음)';
      document.getElementById('histModalBody').textContent = text;
      document.getElementById('histModalOverlay').style.display = 'flex';
    };
  });
}

// 각 헤더의 원래 텍스트(라벨)를 미리 저장해둡니다 (나중에 (1)~(4) 표시를 붙였다 뗐다 하기 위함)
document.querySelectorAll('thead th[data-key]').forEach(function(th){
  th.dataset.label = th.textContent;
});

function updateHeaderMarkers(){
  document.querySelectorAll('thead th[data-key]').forEach(function(th){
    var key = th.dataset.key;
    var base = th.dataset.label;
    var idx = sortKeys.findIndex(function(s){ return s.key === key; });
    th.classList.remove('sorted', 'sorted2', 'sorted3', 'sorted4');
    var mark = '';
    if (idx !== -1) {
      var dir = sortKeys[idx].dir;
      mark = ' (' + (idx + 1) + ')' + (dir === -1 ? ' \u25be' : ' \u25b4');
      th.classList.add(idx === 0 ? 'sorted' : 'sorted' + (idx + 1));
    }
    th.textContent = base + mark;
  });
}

function defaultDir(key){
  return (key === 'datetime' || key === 'isConfirmed' || key === 'item') ? -1 : 1;
}

document.querySelectorAll('thead th[data-key]').forEach(function(th){
  th.addEventListener('click', function(ev){
    var key = th.dataset.key;
    var idx = sortKeys.findIndex(function(s){ return s.key === key; });

    if (ev.shiftKey) {
      // Shift+클릭: 다단계 정렬에 우선순위로 추가/제거 (기존 방식)
      if (idx !== -1) {
        sortKeys.splice(idx, 1);
      } else {
        sortKeys.unshift({ key: key, dir: defaultDir(key) });
        if (sortKeys.length > MAX_SORT_LEVELS) sortKeys.pop();
      }
    } else {
      // 일반 클릭: 그 열 하나만으로 단일 정렬. 이미 그 열 하나만 정렬 중이면 방향만 반전.
      if (sortKeys.length === 1 && sortKeys[0].key === key) {
        sortKeys[0].dir *= -1;
      } else {
        sortKeys = [{ key: key, dir: defaultDir(key) }];
      }
    }

    updateHeaderMarkers();
    render();
  });
});

updateHeaderMarkers();

// 종목 체크박스는 updateItemFilterOptions()에서 새로 만들어질 때마다
// onchange가 개별로 붙습니다(위 함수 참고). 신호세기(1/2/3) 체크박스는
// 처음부터 HTML에 고정으로 있으니 여기서 한 번에 연결합니다.
document.querySelectorAll('.kindChk').forEach(function(chk){
  chk.onchange = render;
});
document.querySelectorAll('.dirChk').forEach(function(chk){
  chk.onchange = render;
});
document.querySelectorAll('.achieveChk').forEach(function(chk){
  chk.onchange = render;
});
document.getElementById('filterDays').onchange = render;

// ---------- 완전삭제: 달성/무효/1주일 지난 신호를 원본 파일에서까지 영구 제거 ----------
// 브라우저 화면에서 즉시 지우는 것과 동시에, 브릿지에게도 같은 기준으로
// 원본 파일(yesspot_signals.txt)을 정리해달라고 요청합니다. 이러면
// 다음에 다시 접속해도 지운 게 다시 나타나지 않습니다.
var PURGE_DAYS = 7; // "1주일 지난 것" 기준

document.getElementById('btnPurge').onclick = function(){
  var cutoff = daysAgoKST(PURGE_DAYS + 1); // "N일(7일) 지난 것" = 최근 N일치(오늘 포함) 범위 밖
  var beforeCount = allRows.length;

  var toKeep = allRows.filter(function(r){
    var isAchievedOrInvalid = (r.achieveStatus === 'achieved' || r.achieveStatus === 'invalid' || r.achieveStatus === 'retracted');
    var isOld = (r.kst || '').slice(0, 10) < cutoff;
    return !(isAchievedOrInvalid || isOld); // 셋 중 하나라도 해당하면 삭제 대상
  });
  var removedCount = beforeCount - toKeep.length;

  if (removedCount === 0) {
    alert('삭제할 항목이 없습니다 (달성/무효/1주일 지난 신호 없음).');
    return;
  }
  if (!confirm('달성/무효/1주일 지난 신호 ' + removedCount + '개를 완전히 삭제하시겠습니까?\n(원본 파일에서도 지워져서, 다시 접속해도 안 돌아옵니다)')) {
    return;
  }

  // 1) 화면에서 즉시 반영 (브릿지 응답을 기다릴 필요 없이 바로 보이게)
  allRows = toKeep;
  render();

  // 2) 브릿지에게도 원본 파일 정리를 요청
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ cmd: 'purge', days: PURGE_DAYS }));
  } else {
    alert('브릿지와 연결이 안 되어있어 원본 파일은 못 지웠습니다.\n화면에서만 지워진 상태이니, 연결 복구 후 다시 눌러주세요.');
  }
};

// ---------- MT5 스타일 인앱 알림: 소리(비프음) + 화면 팝업 ----------
// 윈도우 OS 알림 설정이 사용자 PC마다 달라서 안정적으로 뜨지 않는 경우가
// 있어(가격검증 페이지에서 실제로 겪었던 문제), 이 페이지 안에서 직접
// 뜨는 팝업을 기본 알림 수단으로 씁니다. OS 알림도 혹시 되면 같이 시도.
function playBeep(){
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    osc.start();
    osc.stop(ctx.currentTime + 0.35);
    setTimeout(function(){
      var ctx2 = new (window.AudioContext || window.webkitAudioContext)();
      var osc2 = ctx2.createOscillator();
      var gain2 = ctx2.createGain();
      osc2.connect(gain2); gain2.connect(ctx2.destination);
      osc2.type = 'sine'; osc2.frequency.value = 1046;
      gain2.gain.setValueAtTime(0.15, ctx2.currentTime);
      gain2.gain.exponentialRampToValueAtTime(0.001, ctx2.currentTime + 0.3);
      osc2.start(); osc2.stop(ctx2.currentTime + 0.3);
    }, 180);
  } catch(e) {
    console.error('[비프음 오류]', e);
  }
}

// [신규][2026-09-10][테이블 영역 높이 유동화] 예전엔 .tablewrap이
// max-height:70vh로 고정돼있어서, 화면 해상도나 브라우저 창 크기에 따라
// 테이블 아래에 불필요한 빈 공간(검은 여백)이 남거나, 반대로 내용이 더
// 들어갈 자리가 있는데도 70%에서 스크롤이 걸리는 문제가 있었다. 이제
// "화면에서 테이블 시작점 아래로 남은 공간 전체"를 실제로 재서(getBoundingClientRect)
// 그만큼을 높이로 준다 - 창 크기를 바꾸거나 위쪽 요소(필터바 등)가
// 늘어나도 즉시 다시 맞춰진다.
var TABLEWRAP_BOTTOM_MARGIN_PX = 16; // 화면 맨 아래와 살짝 여백
function fitTableWrapHeight() {
  var el = document.getElementById('tablewrap');
  if (!el) return;
  var top = el.getBoundingClientRect().top;
  var avail = window.innerHeight - top - TABLEWRAP_BOTTOM_MARGIN_PX;
  if (avail < 200) avail = 200; // 너무 작아지는 것 방지(최소 보장 높이)
  el.style.height = avail + 'px';
  // [근본수정][2026-09-10][스크롤바 2개(이중스크롤) 버그] 계산한 높이가
  // 실제 레이아웃(폰트로딩 등으로 top이 조금 더 밀리는 경우 등)과 안
  // 맞으면, tablewrap 자체 스크롤 + 페이지(body) 스크롤이 동시에 생겨서
  // 화면 오른쪽에 스크롤바가 2개(끊어져) 보이는 문제가 실제 확인됨. 계산
  // 직후 문서 전체 높이가 화면을 넘는지 다시 재서, 넘치면 그 초과분만큼
  // tablewrap을 더 줄여서 페이지 자체는 절대 스크롤 안 생기게 만든다
  // (스크롤은 tablewrap 안쪽 하나만 남긴다).
  var overflowPx = document.documentElement.scrollHeight - window.innerHeight;
  if (overflowPx > 0) {
    var corrected = avail - overflowPx - 2;
    if (corrected < 150) corrected = 150;
    el.style.height = corrected + 'px';
  }
}
var _fitTableWrapTimer = null;
function scheduleFitTableWrapHeight() {
  if (_fitTableWrapTimer) clearTimeout(_fitTableWrapTimer);
  _fitTableWrapTimer = setTimeout(fitTableWrapHeight, 80); // 리사이즈 연속발생 디바운스
}
window.addEventListener('resize', scheduleFitTableWrapHeight);

// [워치독 - OnBarAppended 정체감지] 예스스팟 스크립트가 특정 타임프레임
// 라벨에 대해서만 봉완성 통보를 조용히 멈추는 버그를 감지했을 때 뜨는
// 알람. 기존 "예스스팟 응답 없음"(stale-alert)과 동일한 패턴(인페이지
// 팝업 + 브라우저 Notification)을 그대로 재사용한다.
var stallAlertLabels = {}; // key(item|label) -> true, 같은 정체구간엔 중복알람 방지
function handleStallAlert(sig){
  // [2026-09-25 근본수정][재연결시 과거알람 무한재생] 아래 참고(handleDegradedDeferred).
  if (!isLive) return;
  var key = sig.item + '|' + sig.label;
  if (stallAlertLabels[key]) return; // 스크립트 쪽에서도 1회성으로 보내지만 이중 안전장치
  stallAlertLabels[key] = true;
  var title = '🛑 봉완성 통보 중단 감지';
  // [표시형식] sig.price(6번째 필드)에 초단위 경과시간이 실려온다.
  // "N분(전체M초)" 형태로 분/초를 같이 보여준다.

      n.onclick = function(){ window.focus(); n.close(); };
    } catch(e) { console.error('[워치독 알림 오류]', e); }
  }
}

// [2026-09-14 신규][정확성 검증(방안1+3) 반복격리 경고] 같은 봉이 다수결과
// 계속 어긋나 3회 이상 격리되면 뜬다 - 일반 신호테이블로 안 보내고 알람창만
// 띄운다(사용자 스크린샷으로 알림창 가격칸 오표시 확인 후 신설).
function handleBarDataUnstableAlert(sig){
  if (!isLive) return;
  // [2026-09-15 수정][사용자 요청 - 한 줄로만] 원래 title/body/시각 3줄
  // 구조(showInPageAlert)를 쓰고 있었는데, 이 알람은 "요청타임아웃" 등과
  // 같은 성격(긴급하게 눈에 띄면 되지 내용은 한 줄이면 충분)이라 기존에
  // 있던 한줄 전용 함수(showInPageAlertLine)로 바꾼다.
  // [버그수정] sig.reason이 비어보이는 문제(스크린샷: "SP500 -"만 표시) -
  // bridge_signals.py가 BAR_DATA_UNSTABLE_ALERT를 파싱해서 reason을
  // 채워주는데, 구버전 bridge를 쓰고 있으면 reason 자체가 안 생긴다.
  // reason이 없어도 최소한 격리횟수(price 자리에 항상 실림)는 보이게
  // 폴백을 둔다.
  var detail = sig.reason || ('격리횟수=' + (sig.price !== undefined ? sig.price : '?') + ' (상세정보 보려면 bridge_signals.py를 최신버전으로 교체하세요)');
  var line = '⚠️ 봉데이터불안정 ' + sig.item + ' - ' + detail;
  showInPageAlertLine(line);
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
    try {
      var n = new Notification('⚠️ 봉 데이터 불안정', { body: sig.item + ' - ' + detail, tag: 'bar-unstable-' + sig.item });
      n.onclick = function(){ window.focus(); n.close(); };
    } catch(e) { console.error('[봉불안정 알림 오류]', e); }
  }
}

// [2026-09-25 신규][워밍업/재워밍업 저품질 이관 알림] 신호검색 스크립트가
// #주기 지표로 실수신 프레임을 확인해가며 요청 프레임을 재시도(재시도횟수
// 소진)까지 다 써도 못 받으면 "저품질(degraded)"로 표시하고 다음 순환으로
// 이관한다 - 예전엔 이 정보가 예스트레이더 화면(MessageLog)에만 남고
// 대시보드로는 전혀 전달되지 않았다(만들기로 했던 기능이 실제로는 빠져있던
// 것을 사용자가 재확인해서 이번에 추가). BAR_DATA_UNSTABLE_ALERT와 동일하게
// 일반 신호테이블이 아니라 알림창(한 줄)으로만 띄운다.
var degradedDeferredLastAt = {}; // key(item|label) -> 마지막 알림시각(ms), 같은 라벨 연속발생 스팸 억제
var DEGRADED_DEFERRED_COOLDOWN_MS = 60000;
function handleDegradedDeferred(sig){
  // [2026-09-25 근본수정][스크립트 정지 중에도 알림/저품질 개수가 계속
  // 올라가던 버그] 원인: 스크립트가 멈춰서 하트비트가 안 오면(예스스팟
  // 생존감시, STALE_THRESHOLD_MS=60초) 대시보드가 "끊긴 것으로 판단"하고
  // ws.close()->3초 뒤 재연결을 반복하는데, 재연결마다 브릿지
  // (bridge_signals.py의 handler())가 신호로그 파일 "전체 이력"을 처음
  // 부터 다시 통째로 재전송한다(신규 접속과 구분이 안 됨 - 정상 동작).
  // 이 함수를 포함한 시스템알람 핸들러들은 그 재전송이 "과거 이력
  // 리플레이"(isLive===false)인지 "지금 막 벌어진 새 사건"인지 전혀
  // 구분을 안 하고 매번 그대로 알림을 다시 띄우고 있었다 - 실제
  // 매매신호(addSignal/notifySingle)는 진작부터 isLive를 확인해서 이
  // 문제가 없었는데, 이 알람 계열 6개 함수(handleStallAlert/
  // WriteFailureAlert/PendingMismatchAlert/UnexplainedRemovalAlert/
  // BarDataUnstableAlert/DegradedDeferred)만 그 검사가 빠져있었다.
  // 60초마다(정지 상태가 계속되는 한 무한히) 재연결->전체재생이
  // 반복되므로, 이 라벨들의 과거 DEGRADED_DEFERRED 발생 이력 전체가
  // 매번 새 알림처럼 다시 쌓여 개수가 끝없이 올라간 것 - 스크립트 쪽
  // 문제가 아니라 순수 대시보드 표시단 버그였다. 다른 5개 알람 함수와
  // 동일하게 isLive 검사를 추가.
  if (!isLive) return;
  var key = sig.item + '|' + sig.label;
  var now = Date.now();
  if (degradedDeferredLastAt[key] && (now - degradedDeferredLastAt[key]) < DEGRADED_DEFERRED_COOLDOWN_MS) return;
  degradedDeferredLastAt[key] = now;
  var detail = sig.reason || ('주기=' + sig.price);
  var line = '🟡 저품질이관 ' + sig.item + ' ' + sig.label + ' - ' + detail;
  showInPageAlertLine(line);
  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
    try {
      var n = new Notification('🟡 타임프레임 저품질 이관', { body: sig.item + ' ' + sig.label + ' - ' + detail, tag: 'degraded-deferred-' + key });
      n.onclick = function(){ window.focus(); n.close(); };
    } catch(e) { console.error('[저품질이관 알림 오류]', e); }
  }
}

// [신규][2026-09-30] 게이트 카운터 불일치 알림 - 실시간이 센 봉 수와 차트 기준 봉 수가 다를 때 스크립트가
// 남기는 GATE_COUNT_SYNC를 한 줄로 보여준다(원인 수치는 브릿지가 조립한 sig.reason에 이미 들어 있음).
// 판정/감시목록과는 무관한 진단 알림이라 신호테이블에는 안 넣는다. 과거 이력 재생 중(isLive=false)엔 무시.
var gateSyncLastAt = {}; // key(item|label|신호종류) -> 마지막 알림시각(ms)
var GATE_SYNC_COOLDOWN_MS = 60000;
function handleGateCountSync(sig){
  if (!isLive) return;
  var key = sig.item + '|' + sig.label + '|' + (sig.signalKind || '');
  var now = Date.now();
  if (gateSyncLastAt[key] && (now - gateSyncLastAt[key]) < GATE_SYNC_COOLDOWN_MS) return;
  gateSyncLastAt[key] = now;
  var detail = sig.reason || ('실시간 ' + sig.liveCount + ' / 차트 ' + sig.chartCount);
  showInPageAlertLine('🟠 카운터불일치 ' + sig.item + ' ' + sig.label + ' - ' + detail);
}

// ---------- WebSocket 연결 ----------
var ws = null;
function connectWS(){
  var statusEl = document.getElementById('wsStatus');
  statusEl.textContent = '연결 시도중...'; statusEl.className = 'pill off';
  try{
    ws = new WebSocket(WS_URL);
    ws.onopen = function(){
      statusEl.textContent = '연결됨'; statusEl.className = 'pill on';
      document.getElementById('connBanner').style.display = 'none';
      // [근본수정][2026-09-13][강제 새로고침처럼 느껴지던 원인] 예전엔
      // 연결(재연결 포함)될 때마다 allRows/seenKeys를 통째로 비우고
      // 히스토리를 처음부터 다시 쌓았다 - 그래서 네트워크가 잠깐 끊겼다
      // 3초 뒤 자동재연결만 돼도 화면이 강제로 새로고침된 것처럼 싹
      // 비워졌다 다시 채워지는 것처럼 보였다(사용자 지적, 실제로 존재한
      // 문제였음). addSignal은 이미 pk로 기존 행을 찾아 갱신하는 구조라
      // allRows를 안 비워도 히스토리 재생이 자연스럽게 기존 데이터 위에
      // 덮어써진다 - 그래서 최초 접속 때만 비우고, 재연결일 때는 화면을
      // 그대로 유지한 채로 갱신만 되게 한다.
      if (!hasConnectedBefore) {
        resetAllState(); // [근본수정][2026-09-20] allRows/rowsByKey를 한 함수로 항상 같이 초기화
        hasConnectedBefore = true;
      }
      isLive = false; // 과거 기록을 다시 받는 중이므로, history_end 올 때까지는 "신규" 표시 안 함
      lastHeartbeatAt = Date.now(); // [예스스팟 생존 감시] 연결된 시점을 일단 기준으로 삼음
      isStale = false;
      render();
      // [2026-07-19 신규] 종목별 월물/D-day 헤더용 정보 요청
      ws.send(JSON.stringify({ cmd: 'get_contracts' }));
    };
    ws.onclose = function(){
      statusEl.textContent = '연결끊김'; statusEl.className = 'pill off';
      document.getElementById('connBanner').style.display = 'block';
      setTimeout(connectWS, 3000);
    };
    ws.onerror = function(){
      statusEl.textContent = '오류'; statusEl.className = 'pill off';
    };
    // [수정][2026-09-29][대시보드 시작 속도 개선, 사용자 요청 - 2번만]
    // 브릿지가 신호 하나마다 웹소켓 메시지를 따로 보내던 걸(줄 수가
    // 많아질수록 메시지 개수만큼 오버헤드가 누적되어 접속 초기 렌더가
    // 느려짐 - 실측: 10초) 여러 개를 묶어({cmd:'batch', items:[...]})
    // 한 번에 보내도록 브릿지를 고쳤다(handler() 참고). 이 함수는 원래
    // ws.onmessage 몸통 그대로였는데, 배치 안의 각 항목도 완전히 같은
    // 처리 경로를 타야 하므로 재사용 가능한 이름 있는 함수로 뽑아내고,
    // 맨 앞에 배치 풀기(재귀 호출)만 추가했다 - 기존 처리 로직은 단
    // 한 줄도 안 바꿈.
    function processOneSignalMessage(sig){
      try{
        if (sig.cmd === 'batch') {
          (sig.items || []).forEach(processOneSignalMessage);
          return;
        }
        if (sig.cmd === 'history_end') {
          isLive = true; // 이제부터 도착하는 건 전부 "신규(N)"로 표시
          // [신규][2026-09-29] 이력 재생 중엔 scheduleRender가 위에서 아예
          // 걸리지 않으므로(isLive===false였음), 여기서 정확히 한 번
          // 강제로 렌더해서 지금까지 쌓인 전체 이력을 한 번에 보여준다.
          render();
          return;
        }
        if (sig.cmd === 'purge_result') {
          console.log('[완전삭제] 원본 파일 정리 완료 - 삭제:' + sig.removed + '개 / 유지:' + sig.kept + '개');
          return;
        }
        if (sig.cmd === 'purge_keep_pending_result') {
          console.log('[신호달성 완전삭제] 원본 파일 정리 완료 - 삭제:' + sig.removed + '개 / 유지:' + sig.kept + '개 (감시중 신호는 전부 보존됨)');
          return;
        }
        if (sig.cmd === 'contracts_data') {
          handleContractsData(sig.instruments || {});
          return;
        }
        if (sig.cmd === 'diagnostic_log') {
          // [2026-07-27 추가][추적유실 실제 근거 - 진단로그 수신] 각 줄을
          // "시카고 타임스탬프 \t 메시지"로 나눠서, 타임스탬프만 KST로
          // 변환해 저장해둡니다. 지어낸 게 아니라 스크립트가 실제로 남긴
          // 원문 그대로입니다.
          var instSlug = sig.instrument;
          // [근본수정][2026-09-25] 파일별로 이번에 받은 내용으로 "치환"한다
          // (기존 배열에 push하면 재연결마다 파일 전체가 또 쌓임 - 위
          // diagnosticLogsByFile 선언부 주석 참고).
          var fileKey = instSlug + '|' + (sig.filename || '');
          var arr = [];
          (sig.lines || []).forEach(function(line){
            var tabIdx = line.indexOf('\t');
            if (tabIdx === -1) { arr.push({ kstTime: null, text: line }); return; }
            var tsPart = line.slice(0, tabIdx).trim();
            var textPart = line.slice(tabIdx + 1);
            var m = tsPart.match(/^(\d{8})\s+(\d{2}:\d{2}:\d{2})$/);
            var kstTime = m ? chicagoToKST(m[1], m[2]) : null;
            arr.push({ kstTime: kstTime, text: textPart });
          });
          diagnosticLogsByFile[fileKey] = arr;
          // 같은 종목의 다른 파일(min/tick 진단로그 등)들과 합쳐서 기존과
          // 동일하게 instrument 단위 뷰를 유지한다.
          var mergedForInst = [];
          Object.keys(diagnosticLogsByFile).forEach(function(k){
            if (k.indexOf(instSlug + '|') === 0) mergedForInst = mergedForInst.concat(diagnosticLogsByFile[k]);
          });
          diagnosticLogsByInstrument[instSlug] = mergedForInst;
          return;
        }
        if (sig.cmd === 'pending_force_purged') {
          applyForcePurgeEvent(sig);
          return;
        }
        // [신규][2026-09-10][ReqChartEx 요청-응답 3종 정보 실시간 알림]
        // 사용자 요청: "요청했는데 타임아웃난 정보 / 다른 요청 응답인 걸
        // 걸러낸 정보 / 정확히 매칭됐다는 정보" 세 가지를 대시보드 알림창
        // 데이터로 보고 싶다 - 브릿지가 진단로그를 실시간 tail해서 이
        // 3개 태그(REQUEST_TIMEOUT/GHOST_RESPONSE/MATCH_CONFIRMED)만
        // 골라 diag_alert로 보내준다. 타임아웃/유령응답은 "뭔가 놓쳤을
        // 수 있다"는 실제 경고라 기존 방식(팝업+비프음)대로 눈에 띄게
        // 띄우고, 정상매칭(MATCH_CONFIRMED)은 정상 운영 중에도 순환마다
        // 계속 발생해서 매번 팝업+비프로 띄우면 스팸이 되므로 조용히
        // 기록만 한다(logAlertQuiet) - 필요할 때 알림창을 열어보면 셋 다
        // 같은 목록에서 시간순으로 확인 가능.
        if (sig.cmd === 'diag_alert') {
          // [신규][2026-09-11][BAR_MISMATCH - 완전히 조용하게 데이터만 저장]
          // 차트정확도는 알림이 아니라 "리포트용 데이터 축적"이 목적이라,
          // 팝업/비프/quiet-log 어디에도 안 넣고 liveBarMismatchGroups에만
          // 쌓는다 - showChartAccuracyReport가 이걸 그대로 읽어서 표로 그림.
          if (sig.tag === 'BAR_MISMATCH') {
            var bmDetail = sig.detail || '';
            var bmMatch = bmDetail.match(/\[DIAG\]\[BAR_MISMATCH\] label=(\S+) sdate=(\S+) stime=(\S+) history=(\[.*\])/);
            if (bmMatch) {
              try {
                var bmHistory = JSON.parse(bmMatch[4]);
                var bmKey = (sig.instrument || '') + '|' + bmMatch[1] + '|' + bmMatch[2] + '|' + bmMatch[3];
                if (liveBarMismatchGroups[bmKey] === undefined) {
                  // 새 키를 추가하기 전에 상한선 체크 - 넘으면 가장 오래된
                  // 것(Object.keys 순서상 맨 앞, 삽입순서 그대로 유지됨)부터 지운다.
                  var bmKeys = Object.keys(liveBarMismatchGroups);
                  if (bmKeys.length >= liveBarMismatchGroupsMaxSize) delete liveBarMismatchGroups[bmKeys[0]];
                }
                liveBarMismatchGroups[bmKey] = { instrument: (sig.instrument || '').toUpperCase(), label: bmMatch[1], sdate: bmMatch[2], stime: bmMatch[3], history: bmHistory };
              } catch (eBm) { /* JSON 파싱 실패시 그냥 무시 */ }
            }
            return;
          }
          // [수정][2026-09-11][한줄표시로 전면 개편] 사용자 요청: 알림창
          // 팝업 자체는 "이벤트명 종목 타임프레임" 한 줄만 보여주고(시각도
          // 안 보여줌), 라벨별 타임라인 등 나머지 전부는 "🔍 요청진단"
          // 새 창(상세페이지)에서만 보여준다.
          var daKind = (sig.filename && sig.filename.indexOf('_tick_') !== -1) ? '틱봉' : '분봉';
          var daInst = (sig.instrument || '').toUpperCase();
          var daLbl = sig.label || '?';
          var daEventName = { 'REQUEST_TIMEOUT': '요청타임아웃', 'GHOST_RESPONSE': '유령응답폐기', 'MATCH_CONFIRMED': '정상매칭', 'SUSPECT_LABEL_DUP': '오귀속의심' }[sig.tag] || sig.tag;
          var daIcon = { 'REQUEST_TIMEOUT': '⏰', 'GHOST_RESPONSE': '👻', 'MATCH_CONFIRMED': '✅', 'SUSPECT_LABEL_DUP': '🚨' }[sig.tag] || '🔔';
          var daLine = daIcon + ' ' + daEventName + ' ' + daInst + ' ' + daKind + ' ' + daLbl;

          if (!diagAlertEventsByLabel[daLbl]) diagAlertEventsByLabel[daLbl] = [];
          diagAlertEventsByLabel[daLbl].push({ tag: sig.tag, time: new Date().toLocaleTimeString('ko-KR', {hour12:false}), instrument: sig.instrument, kind: daKind, detail: sig.detail || null });
          if (diagAlertEventsByLabel[daLbl].length > 200) diagAlertEventsByLabel[daLbl].shift();

          if (sig.tag === 'MATCH_CONFIRMED') {
            logAlertQuietLine(daLine);
          } else {
            showInPageAlertLine(daLine);
          }
          return;
        }
        // [신규][2026-09-07][브릿지 자체 상태를 대시보드에서 바로 확인]
        // 예전엔 "1-2시간 뒤 자동갱신이 멈춘다" 같은 문제가 생겨도, 그
        // 원인(브릿지 콘솔에만 찍히던 예외/지연 로그)을 보려면 브릿지
        // 터미널 창을 별도로 열어봐야 했다. "예스스팟 응답없음" 알림과
        // 동일한 인페이지 팝업 방식으로, 브릿지가 겪는 문제를 여기서
        // 바로 보여준다 - 콘솔을 따로 켜둘 필요가 없어진다.
        if (sig.cmd === 'bridge_log') {
          var blIcon = sig.level === 'ERROR' ? '🛑' : '⚠️';
          showInPageAlert(blIcon + ' 브릿지 ' + (sig.level === 'ERROR' ? '오류' : '지연'), sig.message || '');
          return;
        }

        // [예스스팟 생존 감시] 신호든 하트비트든, 뭔가 도착했다는 것
        // 자체가 "예스스팟이 살아있다"는 증거이므로 여기서 공통으로 갱신.
        lastHeartbeatAt = Date.now();
        if (isStale) {
          // 끊긴 걸로 판단했다가 다시 신호가 들어오면 복구 처리
          isStale = false;
          lastStaleAlertAt = null;
          statusEl.textContent = '연결됨'; statusEl.className = 'pill on';
        }

        // [워치독] OnBarAppended 정체감지 - 실제 매매신호가 아니므로
        // addSignal(테이블 행 추가)로 안 보내고 알람창만 띄운 뒤 종료.
        if (sig.kind === 'STALL_ALERT') { handleStallAlert(sig); return; }
        if (sig.kind === 'STALL_RECOVERED') { handleStallRecovered(sig); return; }
        // [2026-08-24 신규] 파일쓰기 실패도 마찬가지로 일반 신호테이블로
        // 안 보내고 별도 알람창으로만 처리한다(전에는 이 분기가 없어서
        // 일반테이블에 엉뚱하게 섞여 나왔음).
        if (sig.kind === 'WRITE_FAILURE_ALERT') { handleWriteFailureAlert(sig); return; }
        if (sig.kind === 'PENDING_MISMATCH_ALERT') { handlePendingMismatchAlert(sig); return; }
        if (sig.kind === 'UNEXPLAINED_REMOVAL_ALERT') { handleUnexplainedRemovalAlert(sig); return; }
        // [2026-09-14 신규][버그수정] 정확성 검증(방안1+3) 반복격리 경고도
        // 일반 신호테이블(알림창)이 아니라 알람창으로만 처리한다. 이 분기가
        // 없으면 일반 파서가 6번째 필드를 가격으로 오인해서 알림창 가격칸에
        // 라벨 문자열이 그대로 찍히는 오류가 실제로 확인됨(사용자 스크린샷).
        if (sig.kind === 'BAR_DATA_UNSTABLE_ALERT') { handleBarDataUnstableAlert(sig); return; }
        // [신규][2026-09-25][워밍업/재워밍업 저품질 이관 알림] 요청 프레임을
        // 재시도까지 다 써도 못 받아 다음 순환으로 이관된 타임프레임을 대시보드
        // 모달로 알려준다 - 일반 신호테이블(BULL/BEAR)로는 안 보내고 알림창만.
        if (sig.kind === 'DEGRADED_DEFERRED') { handleDegradedDeferred(sig); return; }
        // [신규][2026-09-30] 게이트 카운터 불일치 진단(스크립트 v5.16 GATE_COUNT_SYNC) - 저품질이관처럼 알림창 한 줄로만 표시
        if (sig.kind === 'GATE_COUNT_SYNC') { handleGateCountSync(sig); return; }

        // [진단용] 실시간 신호가 도착한 "진짜 순간"(브라우저 시계 기준)과,
        // 그 신호 안에 찍혀있는 date/time 값을 나란히 콘솔에 남깁니다.
        // 신호 시각이 미래로 찍히는 문제를 확인할 때, 이 로그의
        // "수신시각"과 "신호에 찍힌 시각(KST 변환값)"을 비교해보세요.
        if (isLive && sig.date && sig.time) {
          console.log('[시각진단] 수신시각(브라우저,KST)=' +
            new Date().toLocaleString('sv-SE', {timeZone:'Asia/Seoul', hour12:false}) +
            ' / 신호원본(CT)=' + sig.date + ' ' + sig.time +
            ' / 신호변환(KST)=' + chicagoToKST(sig.date, sig.time) +
            ' / item=' + sig.item + ' kind=' + sig.kind);
        }
        addSignal(sig);
      }catch(e){
        // [근본수정][2026-09-04][침묵하는 예외로 진단 불가능했던 문제]
        // 콘솔을 열어봐야만 확인 가능한 방식은 실용적이지 않다는 지적에
        // 따라, 기존 알림 시스템(showInPageAlert)을 그대로 재사용해서
        // 화면에 바로 팝업으로 띄운다 - 개발자도구를 열 필요가 없다.
        console.error('[addSignal 처리 실패]', e, sig);
        showInPageAlert('⚠️ 신호 처리 오류', (e && e.message ? e.message : String(e)) + '<br><span style="opacity:0.7">item=' + (sig && sig.item || '?') + ' kind=' + (sig && sig.kind || '?') + '</span>');
      }
    }
    ws.onmessage = function(ev){
      try{
        var sig = JSON.parse(ev.data);
        processOneSignalMessage(sig);
      }catch(e){
        console.error('[메시지 파싱 실패]', e, ev.data);
      }
    };
  }catch(e){
    setTimeout(connectWS, 3000);
  }
}
connectWS();
render();

// ---------- 예스스팟 생존 감시: 주기적으로 확인 ----------
// 5초마다 "마지막으로 뭔가 도착한 시각"을 확인해서, STALE_THRESHOLD_MS
// (60초)보다 오래됐으면 예스스팟이 꺼졌거나 문제가 생긴 것으로 보고
// 상태를 바꾸고 알림을 띄웁니다. 끊긴 상태가 계속되는 동안은 60초마다
// 계속 다시 알려줍니다 (한 번 뜨고 조용해지지 않도록).
setInterval(function(){
  if (lastHeartbeatAt === null) return; // 아직 한 번도 안 받은 상태면 건너뜀
  // [근본수정][2026-09-04][재연결->이력전송 지연->강제종료->재연결 무한루프]
  // 신호가 몇 천 건씩 쌓인 상태에서 재연결하면, 브릿지가 그 방대한 이력을
  // 처음부터 순차 전송하는 데 시간이 걸리는데, 그동안은 진짜 하트비트가
  // 뒤섞여 늦게 오거나 STALE_THRESHOLD_MS(60초)를 넘길 수 있다 - 그러면
  // v1.23에서 추가한 강제종료(ws.close())가 또 발동해서 다시 처음부터
  // 이력을 재전송하게 되고, 또 60초 뒤 stale이 나는 악순환이 반복된다
  // (실제 지적사항: 브릿지 콘솔에 "연결됨/끊어짐"이 짧은 간격으로 계속
  // 반복). isLive(이력 로딩 완료, history_end 수신 여부)가 아직 false인
  // 동안(즉 재연결 후 이력을 한창 받는 중)에는 stale 판정 자체를
  // 건너뛰어서, 이력전송이 다 끝난 뒤부터만 정상적으로 끊김을 감지하게 한다.
  if (!isLive) return;
  var elapsed = Date.now() - lastHeartbeatAt;
  if (elapsed > STALE_THRESHOLD_MS) {
    if (!isStale) {
      isStale = true;
      var statusEl = document.getElementById('wsStatus');
      statusEl.textContent = '신호 끊김(예스스팟 확인)'; statusEl.className = 'pill off';
      // [근본수정][2026-09-04][몇 시간 뒤 자동갱신이 멈추는 구조적 원인]
      // 예전엔 여기서 "끊긴 것 같다"는 알림만 띄우고, 웹소켓 연결 자체를
      // 재시도하는 코드가 전혀 없었다 - 만약 연결이 좀비상태(TCP는 살아
      // 있는 척하지만 실제로는 데이터가 전혀 안 오가는 상태, 오랫동안
      // idle이면 중간 네트워크 장비가 조용히 끊어버리는 흔한 현상)가
      // 되면, ws.onclose 자체가 절대 안 뜨니 재연결 로직(3초 후
      // connectWS)이 영원히 발동을 못 해서, 사용자가 겪은 대로 "몇 시간
      // 뒤부터 자동갱신이 멈춘다"는 증상이 그대로 재현된다. 여기서
      // ws.close()를 명시적으로 호출해서 강제로 끊으면, 이미 있는
      // ws.onclose 핸들러가 정상적으로 발동해 3초 뒤 자동 재연결을
      // 시도하게 된다.
      try { if (ws) ws.close(); } catch (eCloseStale) {}
    }
    // 끊긴 상태가 계속되는 동안, STALE_THRESHOLD_MS(60초) 간격으로 반복 알림
    if (lastStaleAlertAt === null || (Date.now() - lastStaleAlertAt) >= STALE_THRESHOLD_MS) {
      lastStaleAlertAt = Date.now();
      var staleTitle = '⚠️ 예스스팟 응답 없음';
      var staleBody = Math.floor(elapsed/1000) + '초 동안 예스스팟에게서 아무 신호도 못 받았어요. 예스스팟이 꺼졌는지 확인해주세요.';

      // [주 방식] 페이지 안 팝업 + 소리 - OS 알림 설정과 무관하게 항상 뜸
      showInPageAlert(staleTitle, staleBody);

      // [보조 시도] 윈도우 OS 알림도 혹시 되면 같이 시도 (신호 알림과
      // 동일한 패턴 - 이걸 빼먹어서 알림센터에 안 올라왔던 것)
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
        try {
          var sn = new Notification(staleTitle, { body: staleBody, tag: 'stale-alert-' + Date.now() });
          sn.onclick = function(){ window.focus(); sn.close(); };
        } catch(e) {
          console.error('[예스스팟 응답없음 알림 오류]', e);
        }
      }
    }
  }
}, 5000);

// ---------- 종료 버튼: 브릿지에 종료 명령 전송 + 탭 닫기 시도 ----------
document.getElementById('btnShutdown').onclick = function(){
  var ok = confirm('대시보드를 종료하시겠습니까?\n브릿지 서버와 웹서버 창도 함께 닫힙니다.');
  if (!ok) return;
  var btn = this;
  btn.disabled = true; btn.textContent = '종료 중...';
  try{
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({cmd:'shutdown'}));
    }
  }catch(e){}
  setTimeout(function(){
    window.close();
    setTimeout(function(){
      if (!document.hidden) {
        alert('종료 신호를 보냈습니다.\n브라우저 보안 정책상 이 탭은 자동으로 안 닫힐 수 있습니다 - 이제 직접 닫으셔도 됩니다.');
      }
    }, 300);
  }, 400);
};

})();
</script>
